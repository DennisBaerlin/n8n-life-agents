# Dependabot — automated dependency PRs, for github-actions only: the workflows pin third-party
# actions by SHA, and a pinned SHA never auto-updates — Dependabot is what keeps those pins current
# (with the CVE/changelog in the PR). Not listed here, so without version-update PRs from this file:
# cargo (provisioning/desktop), npm (tests/install) and the base images in the Dockerfiles. The linter
# toolchains need no entry: prek bootstraps them in isolation. Supply-chain posture: grouped (one PR, less churn) + a cooldown
# so a freshly published (possibly compromised) action version is not proposed on day zero.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows/** (and a root action.yml, which we don't have).
    directory: "/"
    schedule:
      interval: "daily"
    # Wait N days after a release before opening a PR — a poisoned tag is usually yanked within days
    # (7 = zizmor dependabot-cooldown minimum, docs.zizmor.sh/audits/#dependabot-cooldown).
    cooldown:
      default-days: 7
    # One consolidated PR for all action bumps instead of one-per-action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
