# Bare-core genericity gate — proves the package-install machinery is GENERIC (not secretly wired to
# finance): install ONLY the core, then add the `career` package on top, WITHOUT finance ever present.
# Runs the REAL provision.sh in a privileged systemd container — identical image + flags to the local dev
# substrate (scripts/dev/bootstrap_test_n8n.ps1), so CI and dev cannot drift. No DB-only shortcut:
# apply_schema.sh is peer-auth/runuser/systemctl-coupled, so a postgres-service test would need a drifting
# re-implementation of the apply. doctor.sh is the INFRA gate; the psql asserts (registry state +
# search_path + finance absence) are the actual genericity proof.
# Install-UX-Phase 5 adds the reverse-proxy-on-another-host proof (TRUSTED_PROXIES): only the trusted helper
# container reaches n8n, the table survives an nftables restart, n8n refuses to start without it (fail-closed).
# Install-UX-Phase 4 adds the RUNTIME-modularity proof: in every installed-set state (core-only, +career,
# after an update with career switched off, after uninstall) no deployed workflow holds a literal reference to an
# absent workflow (n8n would refuse to activate it -> deaf bot), and an update keeps the installed set as is.
#
# Secret-free: /rest/owner/setup + /rest/api-keys (the API-key mint) need no LLM/telegram keys; those creds
# are omitted -> skipped (non-fatal). Trigger ACTIVATION failure (telegram trigger, no valid token) is a
# `warn`, not a `die`, in deploy_workflows.sh -> provision.sh still exits 0 + doctor stays green.
#
# Required gate; path-scoped to the provisioning surfaces so it only runs when they change. If the
# privileged-systemd container ever flakes on the runner, diagnose/re-pin — do NOT demote the gate.
name: genericity

on:
  workflow_dispatch:   # Handstart fuer einen Branch ohne PR (gh workflow run genericity.yml --ref <branch>)
  push:
    branches: [main]
    paths:
      - 'provisioning/**'
      - 'packages/**'
      - '.github/workflows/genericity.yml'
  pull_request:
    paths:
      - 'provisioning/**'
      - 'packages/**'
      - '.github/workflows/genericity.yml'

# Least privilege: this job only reads the tree + drives a local container.
permissions:
  contents: read

concurrency:
  group: genericity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bare-core-then-career:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only; the job never pushes

      - name: Boot privileged systemd container (same image + flags as the local substrate)
        run: |
          set -euo pipefail
          # Same reference as scripts/dev/bootstrap_test_n8n.ps1 (tag, NOT digest) -> no CI<->dev drift.
          docker run -d --name la --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            jrei/systemd-debian:12
          # Wait for systemd (accept running|degraded; degraded = one unit failed, systemctl/apt still work).
          state=""
          for _ in $(seq 1 60); do
            state="$(docker exec la systemctl is-system-running 2>/dev/null || true)"
            if [ "$state" = running ] || [ "$state" = degraded ]; then break; fi
            sleep 1
          done
          echo "systemd state: $state"
          [ "$state" = running ] || [ "$state" = degraded ] || { docker logs la || true; exit 1; }

      - name: Stage the tree + a dummy, secret-free unattended env
        run: |
          set -euo pipefail
          docker exec la mkdir -p /opt/lifeagents
          docker cp "$GITHUB_WORKSPACE/." la:/opt/lifeagents
          # Shell-sourceable KEY='value'. Owner identity is dummy (FQDN email + policy-valid password +
          # ISO birth date). Encryption key + DB password are generated by provision.sh when unset; LLM/
          # telegram keys are intentionally omitted (their credentials are then skipped, non-fatal).
          printf "%s\n" \
            "N8N_OWNER_EMAIL='ci@example.com'" \
            "N8N_OWNER_PASSWORD='CiRunner1'" \
            "OWNER_FIRST_NAME='CI'" \
            "OWNER_LAST_NAME='Runner'" \
            "OWNER_BIRTH_DATE='1990-01-01'" \
            "OWNER_LANGUAGE='de'" > ci.env
          docker cp ci.env la:/root/ci.env
          docker exec la chmod 600 /root/ci.env
          # Dangling-reference probe (Install-UX-Phase 4): n8n (checked 2.21.7 + 2.44.4) refuses to ACTIVATE a workflow whose literal
          # executeWorkflow/toolWorkflow target does not exist (workflow-validation.service.ts) -> a core workflow
          # pointing at an absent package = a deaf bot. Counts literal (non-expression) workflowId refs in n8n's own
          # workflow_entity that resolve to no workflow. Must be 0 in every installed-set state below.
          cat > dangling.sh <<'SH'
          set -euo pipefail
          db="$(grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-)"
          runuser -u postgres -- psql -d "$db" -tA -c "
            WITH refs AS (
              SELECT w.name AS src, COALESCE(n->'parameters'->'workflowId'->>'value', n->'parameters'->>'workflowId') AS tgt
              FROM public.workflow_entity w, json_array_elements(w.nodes) n
              WHERE n->>'type' IN ('n8n-nodes-base.executeWorkflow','@n8n/n8n-nodes-langchain.toolWorkflow'))
            SELECT src || ' -> ' || tgt FROM refs
            WHERE tgt IS NOT NULL AND tgt <> '' AND left(tgt,1) <> '='
              AND NOT EXISTS (SELECT 1 FROM public.workflow_entity t WHERE t.id = refs.tgt)"
          SH
          docker cp dangling.sh la:/root/dangling.sh

      - name: Install the BARE core (--core-only, real provision.sh)
        run: |
          set -euo pipefail
          docker exec la bash /opt/lifeagents/provisioning/provision.sh --core-only --profile dev --unattended /root/ci.env

      - name: Assert bare core is genuinely package-neutral (finance NEVER wired in)
        run: |
          set -euo pipefail
          # doctor = infra health only (PG/n8n/ingress/encryption-key). The psql asserts below are the proof.
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='core'")" = active
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t
          test "$(q "SELECT to_regnamespace('career') IS NULL")" = t
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package IN ('finance','career')")" = 0
          # core_ro search_path = base ONLY -> the old finance-hardcode is gone, no package tail yet (B).
          cfg="$(docker exec la runuser -u postgres -- psql -d "$db" -tAc \
            "SELECT s FROM pg_roles r, unnest(r.rolconfig) s WHERE r.rolname='core_ro' AND s LIKE 'search_path=%'")"
          echo "core_ro: $cfg"
          test "$(echo "$cfg" | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')" = "search_path=pg_catalog, agent, core"
          # Install-UX-Phase 4: core alone is runnable — no core workflow points at an absent package workflow
          # (package agents are reached only via agent.sub_dispatch_agent's expression call).
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (core-only):"; echo "$dangling"; exit 1; }
          # A package command/agent of an absent package gets a friendly answer, not a crash (the dispatcher's DB read).
          test "$(q "SELECT core.fn_package_status('{\"package\":\"estate\"}'::jsonb)->>'reason'")" = not_installed

      - name: Add the career package ON TOP (the 2nd package, generic per-package path)
        run: |
          set -euo pipefail
          docker exec la lifeagents package install career

      - name: Assert career installed generically (finance still absent; career in BOTH host role paths)
        run: |
          set -euo pipefail
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          owner="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_USER=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='career'")" = active
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t      # finance was NEVER installed
          test "$(q "SELECT to_regnamespace('career') IS NOT NULL")" = t
          # The generic search_path (B): core_ro AND the n8n owner role now carry the career tail.
          for role in core_ro "$owner"; do
            cfg="$(docker exec la runuser -u postgres -- psql -d "$db" -tAc \
              "SELECT s FROM pg_roles r, unnest(r.rolconfig) s WHERE r.rolname='$role' AND s LIKE 'search_path=%'")"
            echo "$role: $cfg"
            case "$cfg" in *career*) : ;; *) echo "FAIL: $role search_path lacks the career tail"; exit 1 ;; esac
          done
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (core+career):"; echo "$dangling"; exit 1; }

      - name: Update keeps the installed set (career switched off stays off; finance never appears)
        run: |
          set -euo pipefail
          docker exec la lifeagents package deactivate career
          # Re-run = what `lifeagents update` does (no --packages -> core + installed packages only).
          docker exec la bash /opt/lifeagents/provisioning/provision.sh --profile dev --unattended /root/ci.env
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='career'")" = inactive
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package IN ('finance','estate','paperless')")" = 0
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (after update):"; echo "$dangling"; exit 1; }

      - name: Uninstall career -> core stays runnable (no dangling refs, registry clean)
        run: |
          set -euo pipefail
          docker exec la lifeagents package uninstall career --yes
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package='career'")" = 0
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (after uninstall):"; echo "$dangling"; exit 1; }
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh

      - name: Reverse proxy on another host (TRUSTED_PROXIES) — only the proxy reaches n8n, fail-closed
        run: |
          set -euo pipefail
          # Install-UX-Phase 5: two helper containers on the same Docker network — one is the trusted proxy,
          # the other a stranger. The socat-free path matters: traffic from 127.0.0.1 is always admitted (lo).
          docker run -d --name la-proxy alpine:3.20 sleep 3600
          docker run -d --name la-stranger alpine:3.20 sleep 3600
          ip_of() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }
          LA="$(ip_of la)"; PROXY="$(ip_of la-proxy)"
          docker exec la lifeagents proxy set "$PROXY"
          docker exec la grep -qx 'N8N_LISTEN_ADDRESS=0.0.0.0' /etc/n8n/n8n.env
          docker exec la-proxy wget -q -T 5 -O - "http://${LA}:5678/healthz" | grep -q ok
          if docker exec la-stranger wget -q -T 5 -O - "http://${LA}:5678/healthz"; then echo "FAIL: stranger reached n8n"; exit 1; fi
          # Debian's nftables.service flushes the whole ruleset on restart/reload -> our table must come back.
          docker exec la systemctl restart nftables
          sleep 3
          docker exec la nft list table inet lifeagents >/dev/null
          # Requires= (fail-closed) startet n8n beim Firewall-Neustart mit; n8n 2.44.4 braucht ~9 s bis readiness
          # -> darauf warten statt fester Pause, sonst meldet doctor ein startendes n8n als ROT.
          ready=""
          for _ in $(seq 1 60); do
            if docker exec la curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:5678/healthz/readiness 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ -n "$ready" ] || { docker exec la journalctl -u n8n -n 50 --no-pager || true; echo "FAIL: n8n nach nftables-Neustart nicht bereit"; exit 1; }
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          # fail-closed: without the table n8n must refuse to start.
          docker exec la nft delete table inet lifeagents
          if docker exec la systemctl restart n8n; then echo "FAIL: n8n started without firewall table"; exit 1; fi
          # back to "proxy on this host": loopback bind, unit/drop-in/table gone, n8n up again.
          docker exec la lifeagents proxy set 127.0.0.1
          docker exec la grep -qx 'N8N_LISTEN_ADDRESS=127.0.0.1' /etc/n8n/n8n.env
          if docker exec la nft list table inet lifeagents >/dev/null 2>&1; then echo "FAIL: table left behind"; exit 1; fi
          docker exec la test ! -e /etc/systemd/system/lifeagents-firewall.service
          docker exec la systemctl is-active n8n

      - name: Teardown
        if: always()
        run: docker rm -fv la la-proxy la-stranger || true

  # Docker-Verbund (LIFEAGENTS_RUNTIME=compose, provisioning/compose/): dieselbe provision.sh im master-Container, kalt,
  # mit allen Paketen. Beweist: Wrapper-Naht (lib/runtime.sh) traegt die ganze Installation, das master-Image aus dem
  # Release-Weg (`git archive`, LF laut .gitattributes) laeuft, Zweitlauf legt keinen Container neu an, n8n uebersteht
  # einen Neustart, der Rand erreicht n8n, aber weder Postgres noch Gateway, und ein fremder Nachbar-Container samt Volume
  # und Netz bleibt unveraendert (Plan *Wenn Docker schon da ist*).
  # Je Weg nach aussen (lib/reach.sh) ein eigener kalter Lauf: tunnel = echter Tailscale-Container ohne Konto (Anmelde-Link
  # erscheint, nichts wird angemeldet), fritzbox = wan mit internem Zertifikat (*.localhost, keine ACME-Anfrage) samt
  # belegtem Port 80 vorher (nichts wird ueberschrieben). Beide pruefen die Pfad-Liste des Rands und die Tailnet-Sperre.
  compose-stack-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reach: [tunnel, fritzbox]
    # Wie ein Release: der master kommt per Digest aus einem Register (hier ein lokales registry:2) ueber den Release-Pin in
    # compose.yml, OHNE LA_MASTER_IMAGE in der Umgebung (Form: scripts/lib/release_images.ps1).
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    env:
      LA_PROJECT: ci-lifeagents
      LA_EDGE_PORT: '5880'
      LA_WIZARD_PORT: '5881'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the master image from the release tree, push, write the release pin
        run: |
          set -euo pipefail
          img=127.0.0.1:5000/ci/master
          git archive --format=tar HEAD provisioning packages .gitattributes \
            | docker build -q -f provisioning/compose/master.Dockerfile --build-arg RELEASE_TAG=v9.0.0 -t "$img:ci" -
          # CRLF-Fund aus dem Probelauf: ein CR in einem Installer-Skript bricht bash mit pipefail ab.
          crlf="$(docker run --rm --entrypoint sh "$img:ci" -c "grep -rlI \"\$(printf '\r')\" /opt/lifeagents/provisioning || true")"
          [ -z "$crlf" ] || { echo "FAIL CRLF im master-Image:"; echo "$crlf"; exit 1; }
          docker push -q "$img:ci" >/dev/null
          pin="$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$img:ci" | grep -m1 "^$img@sha256:")"
          # Beide erlaubten Formen (contract_lint 33): neutral auf Branches, Release-Pin auf main nach dem Pin-Commit.
          grep -Eq '^  master: &img_master \$\{LA_MASTER_IMAGE(:\?|:-[^}]+/master@sha256:[0-9a-f]{64}\})' provisioning/compose/compose.yml \
            || { echo "FAIL compose.yml ohne erlaubte Pin-Zeile (neutral oder Release-Pin)"; exit 1; }
          sed -i "s|^  master: &img_master .*|  master: \&img_master \${LA_MASTER_IMAGE:-$pin}|" provisioning/compose/compose.yml
          grep -n 'img_master' provisioning/compose/compose.yml
          docker image rm "$img:ci" >/dev/null   # der Stack muss es per Digest aus dem Register ziehen
          echo "MASTER_PIN=$pin" >> "$GITHUB_ENV"
          echo "CORE_IMAGE=$pin" >> "$GITHUB_ENV"
          # Der Kern in der einen Aufruf-Form (Kopf von provisioning/compose/stack.sh); jeder Schritt sourct sie.
          cat > "$RUNNER_TEMP/core.sh" <<'CORE'
          core_args() {
            CORE_A=(--name "$LA_PROJECT-core" --label "io.lifeagents.install=$LA_PROJECT" --env LA_CORE=1 --env LA_PROJECT)
            if [ -n "${LA_CORE_PORTS:-}" ]; then CORE_A+=(--env LA_CORE_PORTS); fi
            CORE_A+=(--mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock "$CORE_IMAGE" stack)
          }
          core() { core_args; docker run --rm -i "${CORE_A[@]}" "$@"; }
          # core_run <name> <verb> [optionen…] — Kern mit --json (stdin leer), Ausgabe nach $RUNNER_TEMP/core-<name>.jsonl/.err;
          # prueft den Vertrag: nur JSON-Zeilen mit "v":1, genau ein result. rc = Exit des Kerns, 99 = Vertrag verletzt (auch
          # unter `|| rc=$?`, wo set -e nicht greift).
          core_run() {
            local n="$1" v="$2" rc=0; shift 2
            core "$v" --json "$@" < /dev/null > "$RUNNER_TEMP/core-$n.jsonl" 2> "$RUNNER_TEMP/core-$n.err" || rc=$?
            cat "$RUNNER_TEMP/core-$n.jsonl"
            [ "$(grep -cv '^{"v":1,' "$RUNNER_TEMP/core-$n.jsonl" || true)" = 0 ] || { echo "FAIL $n: Zeile ohne JSON v1"; return 99; }
            [ "$(jq -s '[.[] | select(.type == "result")] | length' "$RUNNER_TEMP/core-$n.jsonl")" = 1 ] || { echo "FAIL $n: nicht genau ein result"; return 99; }
            return "$rc"
          }
          core_res() { tail -n1 "$RUNNER_TEMP/core-$1.jsonl"; }
          # vol_cat <volume-kurzname> <datei> — Datei aus einem Volume des Projekts lesen (Pruefung, nur lesend).
          vol_cat() {
            docker run --rm --network none --mount "type=volume,src=${LA_PROJECT}_$1,dst=/v,readonly" \
              "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-anchor" 2>/dev/null || echo busybox:1.37)" cat "/v/$2"
          }
          CORE

      - name: Neighbour before (foreign container + volume + network, no label of ours)
        run: |
          set -euo pipefail
          docker network create ci-neighbour-net >/dev/null
          docker volume create ci-neighbour-data >/dev/null
          docker run -d --name ci-neighbour --network ci-neighbour-net -v ci-neighbour-data:/data alpine:3.20 \
            sh -c 'echo keep > /data/marker; sleep 3600' >/dev/null
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.before"; cat "$RUNNER_TEMP/neighbour.before"

      - name: Start the stack through the core on an empty Docker (check, up; values kept in the volume, no secret in the call)
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          core_run check check
          core_res check | jq -e '.ok == true and ([.checks[] | select(.ok)] | length) == 6'
          test -z "$(docker volume ls -q --filter "name=${LA_PROJECT}_probe")"   # Pruef-Volume wieder weg
          # Leeres Docker: up legt Werte und Volumes an. Beweist die Reihenfolge Volume vor Werte-Datei, die die Attrappe nicht
          # sieht (ein Lese-Container auf ein fehlendes Volume legte es ohne Etikett an).
          core_run up1 up
          core_res up1 | jq -e ".ok and .changed and .ports.edge == $LA_EDGE_PORT and .ports.wizard == $LA_WIZARD_PORT and .version == \"v9.0.0\""
          pw="$(docker exec "$LA_PROJECT-master" printenv LA_PG_SUPERPW)"; echo "::add-mask::$pw"
          [[ "$pw" =~ ^[0-9a-f]{64}$ ]] || { echo "FAIL Passwort nicht 64 Hex"; exit 1; }
          test "$(vol_cat var_la stack.env | sed -n 's/^LA_PG_SUPERPW=//p')" = "$pw"
          test "$(docker run --rm --network none --mount "type=volume,src=${LA_PROJECT}_var_la,dst=/v,readonly" "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-anchor")" stat -c %a /v/stack.env)" = 600
          vol_cat var_la core-foreign-images
          # Kein Geheimnis im Aufruf des Kerns (docker inspect zeigt seine Umgebung dauerhaft) und keines in seiner Ausgabe.
          core_args; docker create "${CORE_A[@]}" up --json >/dev/null
          if docker inspect "$LA_PROJECT-core" | grep -qF "$pw"; then echo "FAIL Passwort in docker inspect des Kerns"; exit 1; fi
          docker rm "$LA_PROJECT-core" >/dev/null
          if grep -qF "$pw" "$RUNNER_TEMP"/core-*; then echo "FAIL Passwort in der Ausgabe des Kerns"; exit 1; fi
          # master aus dem Pin (Digest), und er kennt sein eigenes Image (master_swap, upgrade_guard brauchen es)
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = "$MASTER_PIN"
          test "$(docker exec "$LA_PROJECT-master" printenv LA_MASTER_IMAGE)" = "$MASTER_PIN"
          docker inspect -f '{{index .Config.Labels "io.lifeagents.core"}}' "$MASTER_PIN" | grep -qx 1
          # Status ueber den Kern und im master selbst (docker exec), Einmal-Link zum Fragebogen.
          core_run status1 status
          core_res status1 | jq -e '.installed and .running and .core == 1 and (.update_running | not)'
          docker exec "$LA_PROJECT-master" stack status --json | tail -n1 | jq -e '.running'
          # Der Wizard startet mit dem master; sein Steuerkanal kann ein paar Sekunden nach `up` noch fehlen.
          for _ in $(seq 1 15); do core_run url wizard-url >/dev/null && break; sleep 2; done
          core_res url | jq -e --arg p "$LA_WIZARD_PORT" '.ok and (.url | startswith("http://127.0.0.1:" + $p + "/start?t="))' >/dev/null

      - name: Telegram mock in the pod (own container on the anchor, shares 127.0.0.1 with n8n and the master)
        run: bash tests/mock_telegram/start_in_pod.sh "$LA_PROJECT" "$RUNNER_TEMP/tgmock"

      - name: Install like the setup wizard (its answer file, release profile, backup folder on the host)
        run: |
          set -euo pipefail
          # Die Antwort-Datei schreibt derselbe Code wie im Einrichtungs-Assistenten (flow.js im master-Image, Fragen aus
          # bridge.sh questions), nicht eine Handschrift in der CI. Aufruf von provision.sh wie provisioning/wizard/server.js.
          mkdir -p "$RUNNER_TEMP/bk-wizard"
          docker cp tests/wizard/render_ci_answers.js "$LA_PROJECT-master:/tmp/render_ci_answers.js"
          render() { docker exec "$LA_PROJECT-master" node /tmp/render_ci_answers.js --reach ${{ matrix.reach }} --backup "$RUNNER_TEMP/bk-wizard" "$@"; }
          render > "$RUNNER_TEMP/answers.env"
          render --print packages > "$RUNNER_TEMP/packages.arg"
          head -n1 "$RUNNER_TEMP/answers.env" | grep -qx '# lifeagents-answers v1'
          grep -qx "BACKUP_PARENT_DIR=$RUNNER_TEMP/bk-wizard" "$RUNNER_TEMP/answers.env"
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/ids.1"
          docker exec -i "$LA_PROJECT-master" sh -c 'umask 077; cat > /run/lifeagents-wizard/answers.env' < "$RUNNER_TEMP/answers.env"
          # hand-injected: LIFEAGENTS_TELEGRAM_API zeigt die Bot-Aufrufe auf den Mock (im Wizard erbt provision.sh sie aus der Umgebung des master, die compose.yml nicht setzt); LLM_GATEWAY_KEEPALIVE_HOURS=0 verhindert Aufrufe des Gateways mit dem erfundenen Schluessel
          docker exec -e LIFEAGENTS_TELEGRAM_API=http://127.0.0.1:8089 -e LLM_GATEWAY_KEEPALIVE_HOURS=0 -e LIFEAGENTS_RESULT_FILE=/run/lifeagents-wizard/result "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/provision.sh --profile release --unattended /run/lifeagents-wizard/answers.env --packages "$(cat "$RUNNER_TEMP/packages.arg")"
          docker exec "$LA_PROJECT-master" rm -f /run/lifeagents-wizard/answers.env
          # Der Sicherungsschritt ist eine Warnung, kein Abbruch: erst die Datei im Ordner auf dem Rechner beweist ihn.
          sudo find "$RUNNER_TEMP/bk-wizard" -name 'lifeagents-backup-*.nla.enc' | grep -q . \
            || { echo "FAIL keine erste Sicherung im Ordner des Assistenten"; sudo find "$RUNNER_TEMP/bk-wizard"; exit 1; }
          docker exec "$LA_PROJECT-master" grep -q '^BACKUP_HOST_DIR=' /etc/lifeagents/core.env

      - name: Assert the stack (doctor, UTF-8, every workflow published, edge reaches only n8n)
        run: |
          set -euo pipefail
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh
          # Die Version kommt aus dem Image (Build-Argument), nicht aus einem Handgriff beim Installieren.
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.0.0
          # Arbeitsordner der Sicherung: /dev/shm im master ist 256m gross (Docker-Standard waere 64m).
          test "$(docker exec "$LA_PROJECT-master" df -Pm /dev/shm | awk 'NR==2 {print $2}')" -ge 256
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT pg_encoding_to_char(encoding) FROM pg_database WHERE datname='n8n'")" = UTF8
          total="$(q 'SELECT count(*) FROM public.workflow_entity')"
          unpub="$(q 'SELECT count(*) FROM public.workflow_entity WHERE "activeVersionId" IS NULL')"
          echo "workflows: $total, unpublished: $unpub"
          [ "$total" -ge 100 ] && [ "$unpub" = 0 ] || { echo "FAIL workflows: $total (>= 100), unpublished: $unpub (0)"; exit 1; }
          active="$(q "SELECT count(*) FROM core.package_registry WHERE status='active'")"
          [ "$active" -ge 5 ] || { echo "FAIL active packages: $active (>= 5)"; q "SELECT string_agg(package||'='||status, ',') FROM core.package_registry"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_EDGE_PORT}/healthz" || true)"
          [ "$code" = 200 ] || { echo "FAIL edge /healthz: $code (200)"; exit 1; }
          # Gegenprobe: nc funktioniert, n8n ist erreichbar.
          docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 5678 || { echo "FAIL edge does not reach n8n (anchor:5678)"; exit 1; }
          if docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 8090; then echo "FAIL edge reaches the gateway"; exit 1; fi
          if docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 5432; then echo "FAIL edge reaches postgres"; exit 1; fi
          # Wizard-Port: der Wizard laeuft im master, bis die App "Fertig" meldet; ohne Einmal-Wert verweigert er /start (403,
          # seine eigene Antwort, nicht die 502 des Rands). Jeder veroeffentlichte Port nur auf 127.0.0.1.
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_WIZARD_PORT}/start" || true)"
          [ "$code" = 403 ] || { echo "FAIL wizard port /start: $code (403 from the wizard)"; exit 1; }
          docker port "$LA_PROJECT-edge" | tee "$RUNNER_TEMP/ports"
          if grep -v ' -> 127\.0\.0\.1:' "$RUNNER_TEMP/ports"; then echo "FAIL edge publishes beyond 127.0.0.1"; exit 1; fi

      - name: Second run is a no-op (no container recreated) and n8n survives a restart
        run: |
          set -euo pipefail
          # Wie `lifeagents update`: ohne --packages -> Grundsystem + die INSTALLIERTEN Pakete (aus der Registry, also ueber
          # den Datenbank-Wrapper des master); keines darf verloren gehen.
          docker exec -i "$LA_PROJECT-master" sh -c 'umask 077; cat > /run/lifeagents-wizard/answers.env' < "$RUNNER_TEMP/answers.env"
          # hand-injected: wie im Erstlauf (Bot-Aufrufe auf den Mock, Gateway ohne Aufwaermen); ein Lauf ohne sie wuerde die Credential-Adresse auf api.telegram.org zuruecksetzen
          docker exec -e LIFEAGENTS_TELEGRAM_API=http://127.0.0.1:8089 -e LLM_GATEWAY_KEEPALIVE_HOURS=0 "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/provision.sh --profile release --unattended /run/lifeagents-wizard/answers.env
          docker exec "$LA_PROJECT-master" rm -f /run/lifeagents-wizard/answers.env
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT count(*) FROM core.package_registry WHERE status='active'" | tr -d '[:space:]')" -ge 5
          # Der Kern ein zweites Mal auf der fertigen Installation: aendert nichts (gleiche Werte aus var_la, gleiche Pins).
          . "$RUNNER_TEMP/core.sh"
          core_run up2 up
          core_res up2 | jq -e '.ok and (.changed | not) and .pulled == []'
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/ids.2"
          # n8n, gateway und der Tunnel-Knoten entstehen erst im Erstlauf; wan startet erst im Rand-Schritt.
          grep -v -e '-n8n ' -e '-gateway ' -e '-tailscale ' "$RUNNER_TEMP/ids.1" > "$RUNNER_TEMP/ids.1.base"
          grep -v -e '-n8n ' -e '-gateway ' -e '-tailscale ' "$RUNNER_TEMP/ids.2" > "$RUNNER_TEMP/ids.2.base"
          diff "$RUNNER_TEMP/ids.1.base" "$RUNNER_TEMP/ids.2.base"
          # Die Anthropic-Pruefung der Credential-Einspielung (erfundener Schluessel) steht als AxiosError 401 im n8n-Log; die
          # Grenze fuer die Pruefung unten ist darum der Neustart, nicht "die letzten 5 Minuten".
          restarted="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker restart "$LA_PROJECT-n8n" >/dev/null
          ready=""
          for _ in $(seq 1 180); do
            if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness"; then ready=1; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { docker logs --tail 80 "$LA_PROJECT-n8n"; exit 1; }
          # Nach dem Neustart darf kein Auth-Fehler auftauchen (AxiosError 401 = ein Telegram-Aufruf ging an die echte Adresse
          # statt an den Mock, Probelauf-Fund).
          if docker logs --since "$restarted" "$LA_PROJECT-n8n" 2>&1 | grep -q 'AxiosError'; then docker logs --since "$restarted" "$LA_PROJECT-n8n" 2>&1 | tail -40; exit 1; fi
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Edge paths (one public list, editor and wizard closed to the tailnet, proxy hops)
        run: |
          set -euo pipefail
          # Eingang :8088 (Ziel von Funnel und wan) direkt ueber die Container-Adresse des Rands.
          ip="$(docker inspect -f "{{(index .NetworkSettings.Networks \"${LA_PROJECT}_edge_public\").IPAddress}}" "$LA_PROJECT-edge")"
          body() { curl -s --path-as-is --max-time 5 "$@" || true; }
          # Die Liste schreibt der master am Ende der Installation (reach_conf), edge laedt sie binnen 5 s ohne Neustart.
          for _ in $(seq 1 15); do [ "$(body "http://$ip:8088/webhook/ci-nope")" != "Not Found" ] && break; sleep 2; done
          docker exec "$LA_PROJECT-edge" cat /tmp/public.caddy
          # Oeffentlich: landet bei n8n (JSON-Antwort von n8n), nie die 404 des Rands ("Not Found" als Klartext).
          for p in /webhook/ci-nope /webhook-test/ci-nope /webhook-waiting/ci-nope; do
            b="$(body "http://$ip:8088$p")"; echo "$p -> ${b:0:80}"
            [ -n "$b" ] && [ "$b" != "Not Found" ] || { echo "FAIL $p erreicht n8n nicht"; exit 1; }
          done
          b="$(body -X POST -H 'Content-Type: application/json' --data '{}' "http://$ip:8088/webhook-waiting-telegram")"
          [ "$b" != "Not Found" ] || { echo "FAIL /webhook-waiting-telegram gesperrt"; exit 1; }
          # Gesperrt: Editor, REST, API, Gesundheit, Wizard-Pfade, Tricks mit .. und Kodierung -> genau die 404 des Rands.
          for p in / /rest/settings /rest/login /api/v1/workflows /healthz /signin /start /webhook /webhook-waiting-telegramx \
                   /webhook/../rest/settings /webhook/%2e%2e/rest/settings /webhook%2f..%2frest%2fsettings; do
            b="$(body "http://$ip:8088$p")"
            [ "$b" = "Not Found" ] || { echo "FAIL $p ist oeffentlich: ${b:0:120}"; exit 1; }
          done
          # Tailnet simuliert: Tailscale (Userspace) reicht Tailnet-Zugriffe auf 127.0.0.1 im Namensraum des Rands weiter.
          # Editor :8080 und Wizard :8081 muessen von dort scheitern, :8088 (die Liste) muss gehen.
          if docker exec "$LA_PROJECT-edge" wget -q -O /dev/null -T 3 http://127.0.0.1:8080/healthz; then echo "FAIL Editor aus dem Namensraum erreichbar"; exit 1; fi
          # Gesperrt heisst: es kommt gar keine HTTP-Antwort (abort), weder vom Wizard noch eine 502 des Rands.
          wz="$(docker exec "$LA_PROJECT-edge" wget -q -O /dev/null -T 3 http://127.0.0.1:8081/ 2>&1 || true)"
          if printf '%s' "$wz" | grep -q 'HTTP/'; then echo "FAIL Wizard-Eingang antwortet aus dem Namensraum: $wz"; exit 1; fi
          # Gegenprobe: ueber den veroeffentlichten Port antwortet der Wizard (403 ohne Einmal-Wert).
          wz="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_WIZARD_PORT}/start" || true)"
          [ "$wz" = 403 ] || { echo "FAIL wizard port /start from the host: $wz (403)"; exit 1; }
          # Ueber den veroeffentlichten Port (Rechner) bleibt der Editor erreichbar.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_EDGE_PORT}/healthz")" = 200
          docker exec "$LA_PROJECT-master" grep -qx 'N8N_PROXY_HOPS=2' /etc/n8n/n8n.env
          docker exec "$LA_PROJECT-master" grep -qx 'REACH_MODE=${{ matrix.reach }}' /etc/lifeagents/core.env

      - name: Tunnel (Tailscale without an account -> login link, same namespace as the edge)
        if: matrix.reach == 'tunnel'
        run: |
          set -euo pipefail
          edge_id="$(docker inspect -f '{{.Id}}' "$LA_PROJECT-edge")"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$LA_PROJECT-tailscale")" = "container:$edge_id"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$LA_PROJECT-tailscale" | grep -qx 'TS_HOSTNAME=bot'
          # Wizard und App fragen den Stand ueber reach_ctl.sh status (eine JSON-Zeile).
          st=''
          for _ in $(seq 1 45); do
            st="$(docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh status)"
            [ "$(printf '%s' "$st" | jq -r .state)" = needs_login ] && break
            sleep 2
          done
          echo "$st"
          test "$(printf '%s' "$st" | jq -r .state)" = needs_login
          printf '%s' "$st" | jq -er '.url | test("^https://login\\.tailscale\\.com/")' >/dev/null
          test "$(printf '%s' "$st" | jq -r .mode)" = tunnel
          # Ohne Anmeldung gibt es keine Internet-Adresse: DOMAIN bleibt leer.
          if docker exec "$LA_PROJECT-master" grep -q '^DOMAIN=.' /etc/lifeagents/core.env; then echo "FAIL DOMAIN ohne Tunnel gesetzt"; exit 1; fi
          # Tailnet-Zugriff aus dem Tailscale-Container selbst (derselbe Namensraum): Editor gesperrt.
          if docker exec "$LA_PROJECT-tailscale" wget -q -O /dev/null -T 3 http://127.0.0.1:8080/healthz; then echo "FAIL Editor vom Tailscale-Knoten erreichbar"; exit 1; fi
          if docker ps --format '{{.Names}}' | grep -qx "$LA_PROJECT-wan"; then echo "FAIL wan laeuft beim Tunnel-Weg"; exit 1; fi
          # Neuer Link ohne Zuruecksetzen des Knotens.
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh relogin >/dev/null

      - name: FritzBox (ports 80/443 checked first, wan with internal certificate, nothing overwritten)
        if: matrix.reach == 'fritzbox'
        run: |
          set -euo pipefail
          lib='. /opt/lifeagents/provisioning/lib/common.sh'
          st() { docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh status; }
          # Ohne Internet-Adresse startet nichts.
          test "$(st | jq -r .reason)" = no_domain
          docker exec "$LA_PROJECT-master" bash -c "$lib; env_upsert /etc/lifeagents/core.env DOMAIN ci-edge.localhost"
          # Port 80 belegt (fremder Nachbar): wan startet nicht, der Nachbar bleibt, Status raet zum Tunnel.
          docker run -d --name ci-port80 -p 80:80 busybox:1.37 httpd -f -p 80 >/dev/null
          before="$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' ci-port80)"
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          if docker ps --format '{{.Names}}' | grep -qx "$LA_PROJECT-wan"; then echo "FAIL wan trotz belegtem Port 80"; exit 1; fi
          test "$(st | jq -r .state)" = ports_busy
          test "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' ci-port80)" = "$before"
          docker rm -fv ci-port80 >/dev/null
          # Frei: wan startet, Zertifikat intern (*.localhost), alles geht an die Pfad-Liste des Rands.
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          ok=''
          for _ in $(seq 1 30); do
            if curl -sk --max-time 3 --resolve ci-edge.localhost:443:127.0.0.1 -o /dev/null https://ci-edge.localhost/webhook/ci-nope; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs --tail 40 "$LA_PROJECT-wan"; exit 1; }
          w() { curl -sk --path-as-is --max-time 5 --resolve ci-edge.localhost:443:127.0.0.1 "https://ci-edge.localhost$1" || true; }
          b="$(w /webhook/ci-nope)"; [ -n "$b" ] && [ "$b" != "Not Found" ]
          for p in / /rest/settings /healthz /webhook/../rest/settings; do test "$(w "$p")" = "Not Found"; done
          # Port 80 leitet auf HTTPS um (und dient der Zertifikats-Abfrage).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci-edge.localhost' http://127.0.0.1/)" = 308
          test "$(st | jq -r .state)" = pending_activation
          # Zweiter Converge ist still (kein Neustart von wan).
          s1="$(docker inspect -f '{{.State.StartedAt}}' "$LA_PROJECT-wan")"
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          test "$(docker inspect -f '{{.State.StartedAt}}' "$LA_PROJECT-wan")" = "$s1"

      - name: Pair the owner over the real ingress, then the finish step against the Telegram mock
        if: matrix.reach == 'tunnel'
        timeout-minutes: 15
        run: bash tests/mock_telegram/pair_and_finalize.sh "$LA_PROJECT" "$RUNNER_TEMP/tgmock"

      - name: Neighbour after (unchanged)
        run: |
          set -euo pipefail
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.after"
          diff "$RUNNER_TEMP/neighbour.before" "$RUNNER_TEMP/neighbour.after"

      - name: Docker restart (like a reboot of a Linux server) — the stack comes back by its restart rule, the core sees it
        # Nach dem Nachbar-Vergleich: der Nachbar hat keine Neustart-Regel und bliebe danach stehen.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          sudo systemctl restart docker
          for _ in $(seq 1 60); do docker version >/dev/null 2>&1 && break; sleep 2; done
          ready=""
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness"; then ready=1; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.Status}}'; exit 1; }
          core_run status2 status
          core_res status2 | jq -e '.running and ([.services[] | select(.name == "postgres") | .health] == ["healthy"])'
          core_run start1 start
          core_res start1 | jq -e '.ok'
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Uninstall with data through the core — only the images it loaded itself go (first run on an empty Docker)
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          docker rm -fv "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true   # Test-Container am anchor, nicht Teil des Verbunds
          imgs="$(LA_PG_SUPERPW=unused docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml --profile tunnel --profile fritzbox config --images | sort -u)"
          before="$(vol_cat var_la core-foreign-images)"
          core_run del uninstall --delete-data
          core_res del | jq -e '.ok and (.removed.volumes | length) == 9 and (.removed.images | length) > 0'
          core_res del | jq -e --arg m "$MASTER_PIN" '[.kept[] | select(.what == $m)] | length == 1'   # nutzt der Kern gerade
          for i in $imgs; do
            [ "$i" = "$MASTER_PIN" ] && continue
            if printf '%s\n' "$before" | grep -qxF "$i"; then docker image inspect "$i" >/dev/null || { echo "FAIL $i lag vorher da und ist weg"; exit 1; }; continue; fi
            if docker image inspect "$i" >/dev/null 2>&1; then
              core_res del | jq -e --arg i "$i" '[.kept[] | select(.what == $i and .reason == "image_in_use")] | length == 1' >/dev/null \
                || { echo "FAIL $i blieb ohne Grund"; exit 1; }
            fi
          done
          test -z "$(docker ps -a --filter "label=com.docker.compose.project=$LA_PROJECT" --format '{{.Names}}')"
          test -z "$(docker volume ls -q --filter "label=io.lifeagents.install=$LA_PROJECT")"
          docker image inspect alpine:3.20 >/dev/null   # Abbild des Nachbarn

      - name: Logs on failure
        if: failure()
        run: |
          for c in master n8n postgres gateway edge tailscale wan; do echo "=== $c"; docker logs --tail 60 "$LA_PROJECT-$c" 2>&1 || true; done
          tail -n 40 "$RUNNER_TEMP/tgmock/mock_telegram.jsonl" 2>&1 || true
          tail -n 20 "$RUNNER_TEMP"/core-*.err 2>&1 || true

      - name: Teardown (only our project + the neighbour)
        if: always()
        run: |
          docker rm -fv "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true   # der Mock haengt am anchor: zuerst weg
          # Werte nur fuer die Interpolation von compose.yml (das Passwort steht nicht in der Umgebung des Jobs).
          LA_PG_SUPERPW=unused LA_MASTER_IMAGE="${MASTER_PIN:-unused}" \
            docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml --profile tunnel --profile fritzbox down -v --remove-orphans || true
          docker rm -fv ci-port80 "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true
          # Liste aus der einen Adresse (lib/runtime.sh LA_STATE_VOLUMES), nie hier gespiegelt.
          for v in $(sed -n 's/^LA_STATE_VOLUMES="\(.*\)"$/\1/p' provisioning/lib/runtime.sh); do docker volume rm "${LA_PROJECT}_$v" >/dev/null 2>&1 || true; done
          docker rm -fv ci-neighbour >/dev/null 2>&1 || true
          docker volume rm ci-neighbour-data >/dev/null 2>&1 || true
          docker network rm ci-neighbour-net >/dev/null 2>&1 || true

  # Laufzeit im Docker-Verbund (Paket 2): Versionssprung als master-Image-Wechsel ueber den Helfer (lib/master_swap.sh) mit
  # Abbruch je Schritt — Image nicht ladbar / neues Image kaputt (Rueckweg des Helfers) / Einrichtung scheitert nach der
  # Sicherung (lifeagents rollback --yes: Daten zurueck + master zurueck) —, die Tick-Schleife statt der Update-Timer, die
  # CLI ueberlebt jede Neuanlage des master, Sicherung in einen Ordner AUF DEM RECHNER + Restore, doctor misst Namensraum und
  # Netz-Grenze, Deinstallation ohne und mit Daten neben einem Nachbarn (Vorher-Nachher gleich). Kern-Installation
  # (--packages none) haelt den Lauf kurz; alle Pakete prueft compose-stack-cold.
  compose-stack-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Das neue master-Image kommt wie im Release aus einem Register (Digest in der compose.yml des Release-Baums); die Auftrags-
    # Schritte laden es von hier.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    env:
      LA_PROJECT: ci-ops
      LA_EDGE_PORT: '5890'
      LA_WIZARD_PORT: '5891'
      LA_MASTER_IMAGE: ci-ops-master:a
      CORE_IMAGE: ci-ops-master:a
      LA_CORE_PORTS: 5890-5899
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build master images (a = release tree, b = newer, c = broken, d = setup fails after the backup)
        run: |
          set -euo pipefail
          git archive --format=tar HEAD provisioning packages .gitattributes \
            | docker build -q -f provisioning/compose/master.Dockerfile --build-arg RELEASE_TAG=v9.0.0 -t ci-ops-master:a -
          # b traegt wie ein echter Release-Bau seine eigene Nummer (der Kern vergleicht sie mit VERSION der Daten).
          printf 'FROM ci-ops-master:a\nENV RELEASE_TAG=v9.1.0\nLABEL io.lifeagents.ci=b\n' | docker build -q -t ci-ops-master:b -
          printf 'FROM ci-ops-master:a\nRUN rm /usr/bin/jq\n' | docker build -q -t ci-ops-master:c -
          printf '%s\n' 'FROM ci-ops-master:b' \
            "RUN printf '\\nupgrade_finish() { die \"CI: Fehler nach der Sicherung\"; }\\n' >> /opt/lifeagents/provisioning/lib/upgrade_guard.sh" \
            | docker build -q -t ci-ops-master:d -
          docker run --rm --entrypoint tail ci-ops-master:d -n 2 /opt/lifeagents/provisioning/lib/upgrade_guard.sh
          # b ist das Ziel des Update-Auftrags: per Digest aus dem Register (so nennt es die compose.yml des Release-Baums).
          docker tag ci-ops-master:b 127.0.0.1:5000/ci/ops-master:b
          docker push -q 127.0.0.1:5000/ci/ops-master:b >/dev/null
          b_ref="$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' 127.0.0.1:5000/ci/ops-master:b | grep -m1 '^127.0.0.1:5000/ci/ops-master@sha256:')"
          echo "B_REF=$b_ref" >> "$GITHUB_ENV"
          docker image rm 127.0.0.1:5000/ci/ops-master:b >/dev/null
          # Kern-Helfer wie im kalten Lauf (dort erklaert).
          cat > "$RUNNER_TEMP/core.sh" <<'CORE'
          core_args() {
            CORE_A=(--name "$LA_PROJECT-core" --label "io.lifeagents.install=$LA_PROJECT" --env LA_CORE=1 --env LA_PROJECT)
            if [ -n "${LA_CORE_PORTS:-}" ]; then CORE_A+=(--env LA_CORE_PORTS); fi
            CORE_A+=(--mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock "$CORE_IMAGE" stack)
          }
          core() { core_args; docker run --rm -i "${CORE_A[@]}" "$@"; }
          core_run() {
            local n="$1" v="$2" rc=0; shift 2
            core "$v" --json "$@" < /dev/null > "$RUNNER_TEMP/core-$n.jsonl" 2> "$RUNNER_TEMP/core-$n.err" || rc=$?
            cat "$RUNNER_TEMP/core-$n.jsonl"
            [ "$(grep -cv '^{"v":1,' "$RUNNER_TEMP/core-$n.jsonl" || true)" = 0 ] || { echo "FAIL $n: Zeile ohne JSON v1"; return 99; }
            [ "$(jq -s '[.[] | select(.type == "result")] | length' "$RUNNER_TEMP/core-$n.jsonl")" = 1 ] || { echo "FAIL $n: nicht genau ein result"; return 99; }
            return "$rc"
          }
          core_res() { tail -n1 "$RUNNER_TEMP/core-$1.jsonl"; }
          vol_cat() {
            docker run --rm --network none --mount "type=volume,src=${LA_PROJECT}_$1,dst=/v,readonly" \
              "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-anchor" 2>/dev/null || echo busybox:1.37)" cat "/v/$2"
          }
          # app_start <master-abbild> — Start wie die Start-App vor dem Kern: Volumes mit Etikett, Werte ueber die Umgebung,
          # `compose up` vom Rechner (provisioning/desktop/core/src/core_start.rs). Setzt APP_PW.
          app_start() {
            APP_PW="$(openssl rand -hex 16)"; echo "::add-mask::$APP_PW"
            for v in $(sed -n 's/^LA_STATE_VOLUMES="\(.*\)"$/\1/p' provisioning/lib/runtime.sh); do
              docker volume create --label "io.lifeagents.install=$LA_PROJECT" "${LA_PROJECT}_$v" >/dev/null
            done
            # hand-injected: so uebergibt die Start-App ihre Werte (app.env); genau diesen Bestand soll der Kern uebernehmen
            LA_PG_SUPERPW="$APP_PW" LA_MASTER_IMAGE="$1" LA_TS_HOSTNAME=bot \
              docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml up -d --wait anchor postgres master edge
          }
          CORE

      - name: Neighbour before (foreign container, volume, network + a decoy volume with our prefix but no label)
        run: |
          set -euo pipefail
          docker network create ci-neighbour-net >/dev/null
          docker volume create ci-neighbour-data >/dev/null
          docker volume create "${LA_PROJECT}_fremd" >/dev/null
          docker run -d --name ci-neighbour --network ci-neighbour-net -v ci-neighbour-data:/data alpine:3.20 \
            sh -c 'echo keep > /data/marker; sleep 3600' >/dev/null
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data "${LA_PROJECT}_fremd"
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.before"; cat "$RUNNER_TEMP/neighbour.before"

      - name: Stack of the desktop app before the core, then the core takes it over (no container recreated, values kept)
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          app_start ci-ops-master:a
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/app.ids"
          core_run take up
          core_res take | jq -e '.ok and (.changed | not) and .ports.edge == 5890 and .ports.wizard == 5891'
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort | diff "$RUNNER_TEMP/app.ids" -
          # Die Werte der App stehen jetzt im Volume (kein neues Passwort, die Daten bleiben erreichbar).
          test "$(vol_cat var_la stack.env | sed -n 's/^LA_PG_SUPERPW=//p')" = "$APP_PW"
          test "$(vol_cat var_la stack.env | sed -n 's/^LA_TS_HOSTNAME=//p')" = bot
          # Ohne Merkliste (die App hatte keine) bleibt beim Abbau jedes Abbild; genau das prueft der letzte Schritt.
          if vol_cat var_la core-foreign-images 2>/dev/null; then echo "FAIL Merkliste ohne ersten Lauf des Kerns"; exit 1; fi
          if grep -qF "$APP_PW" "$RUNNER_TEMP"/core-*; then echo "FAIL Passwort in der Ausgabe des Kerns"; exit 1; fi
          # Nur fuer die Rechner-seitigen compose-Aufrufe der folgenden Schritte (restart anchor, Teardown).
          echo "LA_PG_SUPERPW=$APP_PW" >> "$GITHUB_ENV"

      - name: stack install hands the answers to provision.sh in the master and reports its exit (broken file -> nothing changes)
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          rc=0; printf 'A=$(touch /tmp/pwned)\n' | core install --json > "$RUNNER_TEMP/core-inst.jsonl" 2> "$RUNNER_TEMP/core-inst.err" || rc=$?
          cat "$RUNNER_TEMP/core-inst.jsonl"
          test "$rc" = 1
          core_res inst | jq -e '.ok == false and .reason == "install_failed" and .provision_exit != 0'
          docker exec "$LA_PROJECT-master" test ! -e /run/lifeagents-wizard/answers.env
          docker exec "$LA_PROJECT-master" test ! -e /tmp/pwned
          docker exec "$LA_PROJECT-master" test ! -e /usr/local/lib/lifeagents/VERSION

      - name: Install the core (release v9.0.0 on image a), CLI + tick loop alive
        run: |
          set -euo pipefail
          # Antwort-Datei wie im Assistenten; Telegram-Mock im Pod (Karte, Tipp und Meldung des Updates laufen ueber ihn).
          bash tests/mock_telegram/start_in_pod.sh "$LA_PROJECT" "$RUNNER_TEMP/tgmock"
          mkdir -p "$RUNNER_TEMP/bk-wizard"
          docker cp tests/wizard/render_ci_answers.js "$LA_PROJECT-master:/tmp/render_ci_answers.js"
          docker exec "$LA_PROJECT-master" node /tmp/render_ci_answers.js --reach tunnel --packages none --backup "$RUNNER_TEMP/bk-wizard" \
            | docker exec -i "$LA_PROJECT-master" sh -c 'umask 077; cat > /run/lifeagents-wizard/answers.env'
          # hand-injected: LIFEAGENTS_TELEGRAM_API zeigt die Bot-Aufrufe auf den Mock (compose.yml setzt sie nicht); LLM_GATEWAY_KEEPALIVE_HOURS=0 verhindert Aufrufe mit dem erfundenen Schluessel
          docker exec -e LIFEAGENTS_TELEGRAM_API=http://127.0.0.1:8089 -e LLM_GATEWAY_KEEPALIVE_HOURS=0 -e LIFEAGENTS_RESULT_FILE=/run/lifeagents-wizard/result "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/provision.sh --profile release --unattended /run/lifeagents-wizard/answers.env --packages none
          docker exec "$LA_PROJECT-master" rm -f /run/lifeagents-wizard/answers.env
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.0.0
          docker exec "$LA_PROJECT-master" test -L /usr/local/bin/lifeagents
          # Die Tick-Schleife laeuft neben dem Wizard (der hier nie "Fertig" bekommt) und schreibt binnen einer Minute.
          for _ in $(seq 1 30); do docker exec "$LA_PROJECT-master" grep -q '^LAST_TICK=' /var/lib/lifeagents/update-tick.state 2>/dev/null && break; sleep 5; done
          docker exec "$LA_PROJECT-master" cat /var/lib/lifeagents/update-tick.state \
            || { echo "FAIL tick loop wrote no update-tick.state within 150 s"; docker top "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Pair the owner (real ingress, Telegram mock) — the update card and its tap need a paired owner
        timeout-minutes: 15
        run: bash tests/mock_telegram/pair_and_finalize.sh "$LA_PROJECT" "$RUNNER_TEMP/tgmock"

      - name: Backup to a folder on the host + restore (Fund 7)
        run: |
          set -euo pipefail
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          mkdir -p "$RUNNER_TEMP/bk"
          docker exec "$LA_PROJECT-master" lifeagents backup host-dir "$RUNNER_TEMP/bk"
          q "INSERT INTO agent.core_contexts (name, description, managed_by, content) VALUES ('ci_restore_probe', 'CI', 'agent', 'vorher')" >/dev/null
          docker exec "$LA_PROJECT-master" lifeagents backup export
          sudo ls -l "$RUNNER_TEMP/bk"
          name="$(sudo find "$RUNNER_TEMP/bk" -maxdepth 1 -name 'lifeagents-backup-*.nla.enc' -printf '%f\n' | head -n1)"
          [ -n "$name" ]
          # Auf der Docker-Platte liegt keine Kopie: die Sicherung steht nur im Rechner-Ordner.
          if docker exec "$LA_PROJECT-master" sh -c 'ls /root/*.nla.enc /opt/lifeagents/*.nla.enc 2>/dev/null' | grep -q .; then echo "FAIL Kopie im master"; exit 1; fi
          q "UPDATE agent.core_contexts SET content = 'nachher' WHERE name = 'ci_restore_probe'" >/dev/null
          docker exec "$LA_PROJECT-master" lifeagents backup restore "$name" --yes
          test "$(q "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'")" = vorher

      - name: Locks — a running core blocks a second core and the start of an update
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          # Ein Kern laeuft mit `up` (hier ein Platzhalter mit festem Namen und dem Verb in den Argumenten; ein echter `up` ist
          # dafuer zu kurz). Nur aendernde Verben sperren das Update (lib/runtime.sh rt_core_changing).
          docker run -d --rm --name "$LA_PROJECT-core" --label "io.lifeagents.install=$LA_PROJECT" --entrypoint sh "$CORE_IMAGE" -c 'sleep 120' up >/dev/null
          rc=0; core up --json > "$RUNNER_TEMP/core-second.jsonl" 2>&1 || rc=$?
          test "$rc" = 125   # Docker lehnt den Namen ab, bevor der zweite Kern laeuft (der Einstieg wertet das als busy)
          rc=0; docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:b' > "$RUNNER_TEMP/swap-locked.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/swap-locked.txt"
          test "$rc" != 0
          grep -q 'eingerichtet oder entfernt' "$RUNNER_TEMP/swap-locked.txt"
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state
          test -z "$(docker ps -q --filter "name=^${LA_PROJECT}-swap$")"
          docker stop "$LA_PROJECT-core" >/dev/null
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = ci-ops-master:a

      - name: Version jump, abort 1 — the new master image cannot be loaded (nothing changes)
        run: |
          set -euo pipefail
          if docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:gibt-es-nicht'; then
            echo "FAIL Wechsel ohne ladbares Image lief"; exit 1
          fi
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = ci-ops-master:a

      - name: Version jump, abort 2 — the new master image is broken (helper rolls back)
        run: |
          set -euo pipefail
          docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:c'
          done=""
          for _ in $(seq 1 60); do
            img="$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null || true)"
            if [ "$img" = ci-ops-master:a ] && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 40 "$LA_PROJECT-master"; exit 1; }
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.0.0
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Release v9.1.0 on a GitHub mock (signed; its compose.yml pins the digest of image b, as a release does)
        run: |
          set -euo pipefail
          tag=v9.1.0; w="$RUNNER_TEMP/gh"; rel="$w/releases/$tag"
          mkdir -p "$rel" "$w/bodies" "$w/src" "$w/gnupg"; chmod 700 "$w/gnupg"
          git archive --format=tar --prefix="n8n-life-agents-$tag/" HEAD provisioning packages .gitattributes | tar -x -C "$w/src"
          cf="$w/src/n8n-life-agents-$tag/provisioning/compose/compose.yml"
          sed -i "s|^  master: &img_master .*|  master: \&img_master \${LA_MASTER_IMAGE:-$B_REF}|" "$cf"
          grep -n 'img_master' "$cf" | head -n1
          tar -czf "$rel/n8n-life-agents-$tag.tar.gz" -C "$w/src" "n8n-life-agents-$tag"
          printf 'echo fake-install\n' > "$rel/install.sh"
          ( cd "$rel" && sha256sum "n8n-life-agents-$tag.tar.gz" install.sh > SHA256SUMS )
          export GNUPGHOME="$w/gnupg"
          gpg --batch --passphrase '' --quick-generate-key 'ci-update-test' ed25519 sign never >/dev/null 2>&1
          gpg --batch --export 'ci-update-test' > "$w/kr.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase '' --local-user ci-update-test --detach-sign -o "$rel/SHA256SUMS.sig" "$rel/SHA256SUMS"
          printf 'Kurz neun.\n' > "$w/bodies/$tag.md"
          m="$LA_PROJECT-master"
          # Der Schluesselbund der Installation (Volume etc_la) nimmt den Test-Schluessel: ein Release des Projekts ist unsigniert nicht zu erzeugen.
          docker cp "$w/kr.gpg" "$m:/etc/lifeagents/release-signing.gpg"
          docker exec "$m" mkdir -p /tmp/mock_github
          docker cp "$w/releases" "$m:/tmp/mock_github/releases"; docker cp "$w/bodies" "$m:/tmp/mock_github/bodies"
          docker cp tests/mock_github/server.js "$m:/tmp/mock_github/server.js"
          # hand-injected: Port, Ordner und neuestes Tag sind die Einstellung des GitHub-Mocks selbst, nicht des geprueften Installers
          docker exec -d -e MOCK_GH_PORT=8093 -e MOCK_GH_SLUG=owner/repo -e MOCK_GH_RELEASE_DIR=/tmp/mock_github/releases -e MOCK_GH_BODY_DIR=/tmp/mock_github/bodies -e MOCK_GH_LATEST=$tag "$m" node /tmp/mock_github/server.js
          for _ in $(seq 1 25); do docker exec "$m" curl -sf http://127.0.0.1:8093/repos/owner/repo/releases/latest >/dev/null && break; sleep 0.4; done
          docker exec "$m" curl -sf http://127.0.0.1:8093/repos/owner/repo/releases/latest | jq -e '.tag_name == "v9.1.0"'

      - name: Update from an install without a version number (dev) — the number is restored, then the release is offered
        # Gesetz Versionsnummer (provisioning/lib/common.sh lifeagents_version_heal): der Release-Check traegt die Nummer des
        # laufenden master-Abbilds nach, bevor er vergleicht. Der naechste Schritt faehrt das Update ueber den echten Auftrag
        # von genau diesem Stand aus.
        run: |
          set -euo pipefail
          m="$LA_PROJECT-master"; log="$RUNNER_TEMP/tgmock/mock_telegram.jsonl"
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          # hand-injected: Release-Quelle und Bot-Adresse zeigen auf die Mocks; die Tick-Schleife des master hat diese Umgebung nicht
          upd() { docker exec -e PROVISION_GH_API=http://127.0.0.1:8093 -e PROVISION_REPO_SLUG=owner/repo -e LIFEAGENTS_TELEGRAM_API=http://127.0.0.1:8089 "$m" lifeagents update "$@"; }
          # Unter der Update-Sperre heilt die Tick-Schleife nicht (lifeagents_version_heal): so sieht doctor den Zustand ohne Nummer.
          if docker exec "$m" flock /run/lifeagents-update.lock sh -c 'echo dev > /usr/local/lib/lifeagents/VERSION; bash /opt/lifeagents/provisioning/doctor.sh' > "$RUNNER_TEMP/doctor-dev.txt"; then
            echo "FAIL doctor ohne Versionsnummer gruen"; exit 1
          fi
          grep -F '[FAIL] Keine Versionsnummer eingetragen (VERSION: dev)' "$RUNNER_TEMP/doctor-dev.txt"
          q "DELETE FROM core.notification_state WHERE source='release_update'; DELETE FROM core.update_requests" >/dev/null
          : > "$log"
          upd --check
          test "$(docker exec "$m" lifeagents version)" = v9.0.0 || { echo "FAIL Versionsnummer nicht nachgetragen: $(docker exec "$m" lifeagents version)"; exit 1; }
          grep -q 'upd%3Anow%3Av9.1.0' "$log" || { echo "FAIL aus 'dev' kommt keine Update-Karte fuer v9.1.0"; tail -n 5 "$log"; exit 1; }

      - name: Update by a real order (card -> tap -> order -> tick -> swap -> version + report), not by calling the helper
        run: |
          set -euo pipefail
          m="$LA_PROJECT-master"; log="$RUNNER_TEMP/tgmock/mock_telegram.jsonl"
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          # hand-injected: Release-Quelle und Bot-Adresse zeigen auf die Mocks; die Tick-Schleife des master hat diese Umgebung nicht
          upd() { docker exec -e PROVISION_GH_API=http://127.0.0.1:8093 -e PROVISION_REPO_SLUG=owner/repo -e LIFEAGENTS_TELEGRAM_API=http://127.0.0.1:8089 "$m" lifeagents update "$@"; }
          test "$(docker exec "$m" lifeagents version)" = v9.0.0
          q "DELETE FROM core.notification_state WHERE source='release_update'; DELETE FROM core.update_requests" >/dev/null
          : > "$log"
          # 1. Der Release-Check schickt die Karte mit dem Knopf (Eingang: die Karte, nicht der Helfer).
          upd --check
          grep -q 'upd%3Anow%3Av9.1.0' "$log" || { echo "FAIL keine Update-Karte fuer v9.1.0"; tail -n 5 "$log"; exit 1; }
          # 2. Der Tipp des Owners ueber den echten Dispatcher legt genau einen Auftrag an.
          owner="$(q "SELECT pp->>'telegram_user_id' FROM agent.core_contexts c, jsonb_array_elements(COALESCE(c.metadata->'facts'->'persons','[]'::jsonb)) pp WHERE c.name='family' AND pp->>'role'='owner' LIMIT 1")"
          [[ "$owner" =~ ^[0-9]+$ ]]
          # Die Tick-Schleife des master hat die Mock-Umgebung nicht: ein Tick von ihr bearbeitete den Auftrag gegen das echte
          # GitHub. Darum erst nach ihrem Tick tippen und den eigenen Tick sofort fahren (die naechsten 60 s gehoeren uns).
          tick() { docker exec "$m" sh -c "sed -n 's/^LAST_TICK=//p' /var/lib/lifeagents/update-tick.state" 2>/dev/null || true; }
          t0="$(tick)"; for _ in $(seq 1 40); do [ "$(tick)" != "$t0" ] && break; sleep 2; done
          test "$(q "SELECT core.fn_dispatch_callback(jsonb_build_object('data','upd:now:v9.1.0','chat_id','$owner','chat_type','private'))->>'ok'")" = true
          test "$(q "SELECT count(*) FROM core.update_requests WHERE finished_at IS NULL AND tag = 'v9.1.0'")" = 1
          # 3. Der Runner uebernimmt den Auftrag: der minuetliche Tick des master, hier von Hand mit der Mock-Umgebung gefahren.
          upd --tick
          # 4. Der neue master schliesst den Auftrag ab: Image aus dem Register, Version, Auftrag erledigt.
          done=""
          for _ in $(seq 1 240); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$m" 2>/dev/null)" = "$B_REF" ] \
               && [ "$(docker exec "$m" lifeagents version 2>/dev/null)" = v9.1.0 ] \
               && docker exec "$m" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null \
               && [ -n "$(q "SELECT outcome FROM core.update_requests WHERE tag = 'v9.1.0' AND outcome IS NOT NULL")" ]; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$m"; q "SELECT id, outcome, stage, reason_code FROM core.update_requests" || true; exit 1; }
          test "$(q "SELECT outcome FROM core.update_requests WHERE tag = 'v9.1.0'")" = succeeded
          docker exec "$m" sh -c 'ls -l /var/lib/lifeagents/backups/pre-upgrade-*.dump.gpg'
          sudo find "$RUNNER_TEMP/bk" -maxdepth 1 -name 'pre-upgrade-*.dump.gpg' | grep -q .
          docker exec "$m" test ! -e /var/lib/lifeagents/upgrade.pending
          # Die Tick-Schleife traegt die Einrichtung des neuen master selbst und tickt erst danach wieder; doctor meldet sie
          # waehrenddessen als stehend. Erst wenn sie nach dem Abschluss wieder schreibt, ist der Zustand ein Befund.
          fin="$(q "SELECT extract(epoch FROM finished_at)::bigint FROM core.update_requests WHERE tag = 'v9.1.0'")"
          ticked=""
          for _ in $(seq 1 180); do
            last="$(docker exec "$m" sh -c "sed -n 's/^LAST_TICK=//p' /var/lib/lifeagents/update-tick.state" 2>/dev/null || true)"
            if [[ "$last" =~ ^[0-9]+$ ]] && [ "$last" -gt "$fin" ]; then ticked=1; break; fi
            sleep 5
          done
          [ -n "$ticked" ] || { echo "FAIL die Tick-Schleife tickt nach dem Update nicht wieder (15 min)"; exit 1; }
          docker exec "$m" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Version jump, abort 3 — setup fails after the backup, then lifeagents rollback --yes (data + master back)
        run: |
          set -euo pipefail
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d postgres -tAc "$1" | tr -d '[:space:]'; }
          docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.2.0 "$LA_COMPOSE_FILE" ci-ops-master:d'
          done=""
          for _ in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null)" = ci-ops-master:d ] \
               && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" test -e /var/lib/lifeagents/upgrade.pending   # gescheitert NACH der Sicherung
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.1.0
          grep -qxF "FROM_MASTER_IMAGE=$B_REF" <(docker exec "$LA_PROJECT-master" cat /var/lib/lifeagents/upgrade.pending)
          docker exec "$LA_PROJECT-master" lifeagents rollback --yes
          done=""
          for _ in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null)" = "$B_REF" ] \
               && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null \
               && [ -z "$(q "SELECT 1 FROM pg_database WHERE datname = 'n8n_before_rollback'")" ]; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/upgrade.pending
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'" | tr -d '[:space:]')" = vorher
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Sleep and restart of the host — frozen containers (docker pause), then every container stopped and started at once
        timeout-minutes: 20
        run: |
          set -euo pipefail
          m="$LA_PROJECT-master"
          ours() { docker ps -aq --filter "label=io.lifeagents.install=$LA_PROJECT"; }
          running() { docker ps -q --filter "label=io.lifeagents.install=$LA_PROJECT"; }
          tick() { docker exec "$m" sh -c "sed -n 's/^LAST_TICK=//p' /var/lib/lifeagents/update-tick.state" 2>/dev/null || true; }
          ready() { for _ in $(seq 1 120); do curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness" && return 0; sleep 3; done; return 1; }
          # Schlaf: der Rechner friert alle Prozesse ein, die Uhr springt danach um die Schlafzeit weiter (hier: docker pause).
          before="$(tick)"; [[ "$before" =~ ^[0-9]+$ ]]
          # Je Container: einer, der im Schlaf endet (sein cgroup ist dann weg, resume scheitert), kommt ueber die
          # Neustart-Regel zurueck; rot ist nur ein Container, der eingefroren bleibt. Die Zeile nennt ihn fuer die Diagnose.
          state() { docker inspect -f '{{.Name}} {{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' "$1" 2>&1; }
          for c in $(running); do docker pause "$c" >/dev/null || echo "pause scheiterte: $(state "$c")"; done
          sleep 150
          for c in $(running); do
            docker unpause "$c" >/dev/null && continue
            echo "unpause scheiterte: $(state "$c")"
            sleep 10
            [ "$(docker inspect -f '{{.State.Paused}}' "$c" 2>/dev/null)" != true ] || { echo "FAIL Container bleibt eingefroren: $(state "$c")"; exit 1; }
          done
          ready || { docker logs --tail 60 "$LA_PROJECT-n8n"; exit 1; }
          woke=""
          for _ in $(seq 1 60); do now="$(tick)"; if [[ "$now" =~ ^[0-9]+$ ]] && [ "$now" -gt "$before" ]; then woke=1; break; fi; sleep 3; done
          [ -n "$woke" ] || { echo "FAIL die Tick-Schleife tickt nach dem Schlaf nicht wieder"; exit 1; }
          # Neustart von Docker oder Rechner: alle Container sind aus und starten gleichzeitig wieder (Reihenfolge nicht bestimmt).
          running | xargs docker stop >/dev/null
          # Wie die Neustart-Regel von Docker: wer nicht hochkommt (ein Mitglied vor dem anchor), wird erneut versucht.
          for _ in $(seq 1 10); do
            ours | xargs docker start >/dev/null 2>&1 || true
            [ -z "$(docker ps -aq --filter "label=io.lifeagents.install=$LA_PROJECT" --filter status=exited --filter status=created)" ] && break
            sleep 3
          done
          ready || { docker logs --tail 60 "$LA_PROJECT-n8n"; exit 1; }
          before="$(tick)"; woke=""
          for _ in $(seq 1 60); do now="$(tick)"; if [[ "$now" =~ ^[0-9]+$ ]] && [ "$now" -gt "$before" ]; then woke=1; break; fi; sleep 3; done
          [ -n "$woke" ] || { echo "FAIL die Tick-Schleife tickt nach dem Neustart nicht wieder"; exit 1; }
          test "$(docker exec "$m" lifeagents version)" = v9.1.0
          docker exec "$m" bash /opt/lifeagents/provisioning/doctor.sh

      - name: doctor sees a separated namespace after a lone anchor restart (Einwand 17)
        run: |
          set -euo pipefail
          # Der Mock haengt am Namensraum des anchor und wird vor dessen Neustart entfernt.
          docker rm -fv "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true
          docker restart "$LA_PROJECT-anchor" >/dev/null
          out="$(docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh || true)"
          printf '%s\n' "$out" | grep 'Netz-Namensraum getrennt'
          docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml restart anchor >/dev/null   # restart: true im Pod zieht die Mitglieder nach
          for _ in $(seq 1 60); do curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness" && break; sleep 3; done
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Uninstall keeping data (older core hands over), data is found again; uninstall with data; neighbour unchanged
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          # Ein aelteres Abbild als Einstieg: der master laeuft nach dem Update mit b, also macht dessen Kern die Arbeit.
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = "$B_REF"
          core_run un1 uninstall
          core_res un1 | jq -e '.ok and .delegated_from == "ci-ops-master:a"'
          test -z "$(docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --filter "label=com.docker.compose.project=$LA_PROJECT" --format '{{.Names}}')"
          docker volume inspect "${LA_PROJECT}_pgdata" >/dev/null
          # Ohne master entscheiden die Daten: v9.1.0 liegt im Volume, Abbild a ist v9.0.0 -> ablehnen, nichts anlegen.
          rc=0; core_run old up || rc=$?
          test "$rc" = 1
          core_res old | jq -e '.reason == "newer_installation"'
          test -z "$(docker ps -a --filter "label=com.docker.compose.project=$LA_PROJECT" --format '{{.Names}}')"
          # Mit dem Abbild der Installation: gleiche Werte aus var_la, die Datenbank ist mit demselben Passwort erreichbar.
          CORE_IMAGE="$B_REF" core_run up3 up
          core_res up3 | jq -e '.ok and .changed and .ports.edge == 5890 and .version == "v9.1.0"'
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'" | tr -d '[:space:]')" = vorher
          imgs="$(LA_MASTER_IMAGE="$B_REF" docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml --profile tunnel --profile fritzbox config --images | sort -u)"
          CORE_IMAGE="$B_REF" core_run un2 uninstall --delete-data
          # Bestand der App ohne Merkliste: kein Abbild wird entfernt (es koennte vorher schon da gewesen sein).
          core_res un2 | jq -e '.ok and .removed.images == [] and (.removed.volumes | length) == 9'
          for i in $imgs; do docker image inspect "$i" >/dev/null 2>&1 || { echo "FAIL Abbild $i entfernt"; exit 1; }; done
          test -z "$(docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}}')"
          test -z "$(docker volume ls --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Name}}')"
          test -z "$(docker network ls --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Name}}')"
          core_run un3 uninstall --delete-data
          core_res un3 | jq -e '.ok and .removed.containers == 0'
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data "${LA_PROJECT}_fremd"
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.after"
          diff "$RUNNER_TEMP/neighbour.before" "$RUNNER_TEMP/neighbour.after"

      - name: Installation from before the core (master image without the core label) — up refused, status and uninstall work
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/core.sh"
          printf 'FROM ci-ops-master:a\nLABEL io.lifeagents.core=""\n' | docker build -q -t ci-ops-master:old -
          app_start ci-ops-master:old
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/old.ids"
          # Anlegen haengt an den Pins des Abbilds: ein fremder Kern legte den Verbund am signierten Update vorbei an.
          rc=0; core_run leg up || rc=$?
          test "$rc" = 1
          core_res leg | jq -e '.reason == "legacy_installation"'
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort | diff "$RUNNER_TEMP/old.ids" -
          core_run legst status
          core_res legst | jq -e '.ok and .running and .core == 0'
          # Entfernen haengt nicht an den Pins: auch diese Installation laesst sich abbauen, die Daten bleiben.
          core_run legun uninstall
          core_res legun | jq -e '.ok and .removed.containers == 4'
          test -z "$(docker ps -a --filter "label=com.docker.compose.project=$LA_PROJECT" --format '{{.Names}}')"
          docker volume inspect "${LA_PROJECT}_pgdata" >/dev/null
          if docker ps -a --format '{{.Names}}' | grep -qx "$LA_PROJECT-core-next"; then echo "FAIL Weitergabe an ein Abbild ohne Kern"; exit 1; fi

      - name: Logs on failure
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/tgmock/mock_telegram.jsonl" 2>&1 || true
          tail -n 20 "$RUNNER_TEMP"/core-*.err 2>&1 || true
          # Neustarts und Ende je Container (Ursache fuer "ein Container startet von selbst neu": tailscale ohne Anmeldung endet
          # nach 60 s von selbst, die Neustart-Regel startet ihn neu; OOM und Exit-Code trennen das von einem Speicherfund).
          docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}}' | sort | while read -r c; do
            docker inspect -f '{{.Name}} {{.State.Status}} paused={{.State.Paused}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$c" 2>&1 || true
          done
          for c in master n8n postgres gateway edge tailscale swap; do echo "=== $c"; docker logs --tail 80 "$LA_PROJECT-$c" 2>&1 || true; done
          docker exec "$LA_PROJECT-master" sh -c 'cat /var/lib/lifeagents/master-swap/state; tail -n 60 /var/lib/lifeagents/log/*.log' 2>&1 || true

      - name: Teardown (only our project + the neighbour)
        if: always()
        run: |
          docker rm -fv "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true   # der Mock haengt am anchor: zuerst weg
          docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml down -v --remove-orphans || true
          docker rm -fv "$LA_PROJECT-swap" "$LA_PROJECT-tgmock" >/dev/null 2>&1 || true
          docker volume rm "${LA_PROJECT}_fremd" "${LA_PROJECT}_shared" "${LA_PROJECT}_gw_code" "${LA_PROJECT}_n8n_patches" >/dev/null 2>&1 || true
          # Liste aus der einen Adresse (lib/runtime.sh LA_STATE_VOLUMES), nie hier gespiegelt.
          for v in $(sed -n 's/^LA_STATE_VOLUMES="\(.*\)"$/\1/p' provisioning/lib/runtime.sh); do docker volume rm "${LA_PROJECT}_$v" >/dev/null 2>&1 || true; done
          docker rm -fv ci-neighbour >/dev/null 2>&1 || true
          docker volume rm ci-neighbour-data >/dev/null 2>&1 || true
          docker network rm ci-neighbour-net >/dev/null 2>&1 || true
