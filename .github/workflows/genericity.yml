# Bare-core genericity gate — proves the package-install machinery is GENERIC (not secretly wired to
# finance): install ONLY the core, then add the `career` package on top, WITHOUT finance ever present.
# Runs the REAL provision.sh in a privileged systemd container — identical image + flags to the local dev
# substrate (scripts/dev/bootstrap_test_n8n.ps1), so CI and dev cannot drift. No DB-only shortcut:
# apply_schema.sh is peer-auth/runuser/systemctl-coupled, so a postgres-service test would need a drifting
# re-implementation of the apply. doctor.sh is the INFRA gate; the psql asserts (registry state +
# search_path + finance absence) are the actual genericity proof.
# Install-UX-Phase 5 adds the reverse-proxy-on-another-host proof (TRUSTED_PROXIES): only the trusted helper
# container reaches n8n, the table survives an nftables restart, n8n refuses to start without it (fail-closed).
# Install-UX-Phase 4 adds the RUNTIME-modularity proof: in every installed-set state (core-only, +career,
# after an update with career switched off, after uninstall) no deployed workflow holds a literal reference to an
# absent workflow (n8n would refuse to activate it -> deaf bot), and an update keeps the installed set as is.
#
# Secret-free: /rest/owner/setup + /rest/api-keys (the API-key mint) need no LLM/telegram keys; those creds
# are omitted -> skipped (non-fatal). Trigger ACTIVATION failure (telegram trigger, no valid token) is a
# `warn`, not a `die`, in deploy_workflows.sh -> provision.sh still exits 0 + doctor stays green.
#
# Required gate; path-scoped to the provisioning surfaces so it only runs when they change. If the
# privileged-systemd container ever flakes on the runner, diagnose/re-pin — do NOT demote the gate.
name: genericity

on:
  workflow_dispatch:   # Handstart fuer einen Branch ohne PR (gh workflow run genericity.yml --ref <branch>)
  push:
    branches: [main]
    paths:
      - 'provisioning/**'
      - 'packages/**'
      - '.github/workflows/genericity.yml'
  pull_request:
    paths:
      - 'provisioning/**'
      - 'packages/**'
      - '.github/workflows/genericity.yml'

# Least privilege: this job only reads the tree + drives a local container.
permissions:
  contents: read

concurrency:
  group: genericity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bare-core-then-career:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only; the job never pushes

      - name: Boot privileged systemd container (same image + flags as the local substrate)
        run: |
          set -euo pipefail
          # Same reference as scripts/dev/bootstrap_test_n8n.ps1 (tag, NOT digest) -> no CI<->dev drift.
          docker run -d --name la --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            jrei/systemd-debian:12
          # Wait for systemd (accept running|degraded; degraded = one unit failed, systemctl/apt still work).
          state=""
          for _ in $(seq 1 60); do
            state="$(docker exec la systemctl is-system-running 2>/dev/null || true)"
            if [ "$state" = running ] || [ "$state" = degraded ]; then break; fi
            sleep 1
          done
          echo "systemd state: $state"
          [ "$state" = running ] || [ "$state" = degraded ] || { docker logs la || true; exit 1; }

      - name: Stage the tree + a dummy, secret-free unattended env
        run: |
          set -euo pipefail
          docker exec la mkdir -p /opt/lifeagents
          docker cp "$GITHUB_WORKSPACE/." la:/opt/lifeagents
          # Shell-sourceable KEY='value'. Owner identity is dummy (FQDN email + policy-valid password +
          # ISO birth date). Encryption key + DB password are generated by provision.sh when unset; LLM/
          # telegram keys are intentionally omitted (their credentials are then skipped, non-fatal).
          printf "%s\n" \
            "N8N_OWNER_EMAIL='ci@example.com'" \
            "N8N_OWNER_PASSWORD='CiRunner1'" \
            "OWNER_FIRST_NAME='CI'" \
            "OWNER_LAST_NAME='Runner'" \
            "OWNER_BIRTH_DATE='1990-01-01'" \
            "OWNER_LANGUAGE='de'" > ci.env
          docker cp ci.env la:/root/ci.env
          docker exec la chmod 600 /root/ci.env
          # Dangling-reference probe (Install-UX-Phase 4): n8n (checked 2.21.7 + 2.44.4) refuses to ACTIVATE a workflow whose literal
          # executeWorkflow/toolWorkflow target does not exist (workflow-validation.service.ts) -> a core workflow
          # pointing at an absent package = a deaf bot. Counts literal (non-expression) workflowId refs in n8n's own
          # workflow_entity that resolve to no workflow. Must be 0 in every installed-set state below.
          cat > dangling.sh <<'SH'
          set -euo pipefail
          db="$(grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-)"
          runuser -u postgres -- psql -d "$db" -tA -c "
            WITH refs AS (
              SELECT w.name AS src, COALESCE(n->'parameters'->'workflowId'->>'value', n->'parameters'->>'workflowId') AS tgt
              FROM public.workflow_entity w, json_array_elements(w.nodes) n
              WHERE n->>'type' IN ('n8n-nodes-base.executeWorkflow','@n8n/n8n-nodes-langchain.toolWorkflow'))
            SELECT src || ' -> ' || tgt FROM refs
            WHERE tgt IS NOT NULL AND tgt <> '' AND left(tgt,1) <> '='
              AND NOT EXISTS (SELECT 1 FROM public.workflow_entity t WHERE t.id = refs.tgt)"
          SH
          docker cp dangling.sh la:/root/dangling.sh

      - name: Install the BARE core (--core-only, real provision.sh)
        run: |
          set -euo pipefail
          docker exec la bash /opt/lifeagents/provisioning/provision.sh --core-only --profile dev --unattended /root/ci.env

      - name: Assert bare core is genuinely package-neutral (finance NEVER wired in)
        run: |
          set -euo pipefail
          # doctor = infra health only (PG/n8n/ingress/encryption-key). The psql asserts below are the proof.
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='core'")" = active
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t
          test "$(q "SELECT to_regnamespace('career') IS NULL")" = t
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package IN ('finance','career')")" = 0
          # core_ro search_path = base ONLY -> the old finance-hardcode is gone, no package tail yet (B).
          cfg="$(docker exec la runuser -u postgres -- psql -d "$db" -tAc \
            "SELECT s FROM pg_roles r, unnest(r.rolconfig) s WHERE r.rolname='core_ro' AND s LIKE 'search_path=%'")"
          echo "core_ro: $cfg"
          test "$(echo "$cfg" | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')" = "search_path=pg_catalog, agent, core"
          # Install-UX-Phase 4: core alone is runnable — no core workflow points at an absent package workflow
          # (package agents are reached only via agent.sub_dispatch_agent's expression call).
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (core-only):"; echo "$dangling"; exit 1; }
          # A package command/agent of an absent package gets a friendly answer, not a crash (the dispatcher's DB read).
          test "$(q "SELECT core.fn_package_status('{\"package\":\"estate\"}'::jsonb)->>'reason'")" = not_installed

      - name: Add the career package ON TOP (the 2nd package, generic per-package path)
        run: |
          set -euo pipefail
          docker exec la lifeagents package install career

      - name: Assert career installed generically (finance still absent; career in BOTH host role paths)
        run: |
          set -euo pipefail
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          owner="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_USER=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='career'")" = active
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t      # finance was NEVER installed
          test "$(q "SELECT to_regnamespace('career') IS NOT NULL")" = t
          # The generic search_path (B): core_ro AND the n8n owner role now carry the career tail.
          for role in core_ro "$owner"; do
            cfg="$(docker exec la runuser -u postgres -- psql -d "$db" -tAc \
              "SELECT s FROM pg_roles r, unnest(r.rolconfig) s WHERE r.rolname='$role' AND s LIKE 'search_path=%'")"
            echo "$role: $cfg"
            case "$cfg" in *career*) : ;; *) echo "FAIL: $role search_path lacks the career tail"; exit 1 ;; esac
          done
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (core+career):"; echo "$dangling"; exit 1; }

      - name: Update keeps the installed set (career switched off stays off; finance never appears)
        run: |
          set -euo pipefail
          docker exec la lifeagents package deactivate career
          # Re-run = what `lifeagents update` does (no --packages -> core + installed packages only).
          docker exec la bash /opt/lifeagents/provisioning/provision.sh --profile dev --unattended /root/ci.env
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT status FROM core.package_registry WHERE package='career'")" = inactive
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package IN ('finance','estate','paperless')")" = 0
          test "$(q "SELECT to_regnamespace('finance') IS NULL")" = t
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (after update):"; echo "$dangling"; exit 1; }

      - name: Uninstall career -> core stays runnable (no dangling refs, registry clean)
        run: |
          set -euo pipefail
          docker exec la lifeagents package uninstall career --yes
          db="$(docker exec la bash -c "grep -E '^DB_POSTGRESDB_DATABASE=' /etc/n8n/n8n.env | head -n1 | cut -d= -f2-")"
          q() { docker exec la runuser -u postgres -- psql -d "$db" -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT count(*) FROM core.package_registry WHERE package='career'")" = 0
          dangling="$(docker exec la bash /root/dangling.sh)"
          [ -z "$dangling" ] || { echo "FAIL dangling workflow refs (after uninstall):"; echo "$dangling"; exit 1; }
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh

      - name: Reverse proxy on another host (TRUSTED_PROXIES) — only the proxy reaches n8n, fail-closed
        run: |
          set -euo pipefail
          # Install-UX-Phase 5: two helper containers on the same Docker network — one is the trusted proxy,
          # the other a stranger. The socat-free path matters: traffic from 127.0.0.1 is always admitted (lo).
          docker run -d --name la-proxy alpine:3.20 sleep 3600
          docker run -d --name la-stranger alpine:3.20 sleep 3600
          ip_of() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }
          LA="$(ip_of la)"; PROXY="$(ip_of la-proxy)"
          docker exec la lifeagents proxy set "$PROXY"
          docker exec la grep -qx 'N8N_LISTEN_ADDRESS=0.0.0.0' /etc/n8n/n8n.env
          docker exec la-proxy wget -q -T 5 -O - "http://${LA}:5678/healthz" | grep -q ok
          if docker exec la-stranger wget -q -T 5 -O - "http://${LA}:5678/healthz"; then echo "FAIL: stranger reached n8n"; exit 1; fi
          # Debian's nftables.service flushes the whole ruleset on restart/reload -> our table must come back.
          docker exec la systemctl restart nftables
          sleep 3
          docker exec la nft list table inet lifeagents >/dev/null
          # Requires= (fail-closed) startet n8n beim Firewall-Neustart mit; n8n 2.44.4 braucht ~9 s bis readiness
          # -> darauf warten statt fester Pause, sonst meldet doctor ein startendes n8n als ROT.
          ready=""
          for _ in $(seq 1 60); do
            if docker exec la curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:5678/healthz/readiness 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ -n "$ready" ] || { docker exec la journalctl -u n8n -n 50 --no-pager || true; echo "FAIL: n8n nach nftables-Neustart nicht bereit"; exit 1; }
          docker exec la bash /opt/lifeagents/provisioning/doctor.sh
          # fail-closed: without the table n8n must refuse to start.
          docker exec la nft delete table inet lifeagents
          if docker exec la systemctl restart n8n; then echo "FAIL: n8n started without firewall table"; exit 1; fi
          # back to "proxy on this host": loopback bind, unit/drop-in/table gone, n8n up again.
          docker exec la lifeagents proxy set 127.0.0.1
          docker exec la grep -qx 'N8N_LISTEN_ADDRESS=127.0.0.1' /etc/n8n/n8n.env
          if docker exec la nft list table inet lifeagents >/dev/null 2>&1; then echo "FAIL: table left behind"; exit 1; fi
          docker exec la test ! -e /etc/systemd/system/lifeagents-firewall.service
          docker exec la systemctl is-active n8n

      - name: Teardown
        if: always()
        run: docker rm -fv la la-proxy la-stranger || true

  # Docker-Verbund (LIFEAGENTS_RUNTIME=compose, provisioning/compose/): dieselbe provision.sh im master-Container, kalt,
  # mit allen Paketen. Beweist: Wrapper-Naht (lib/runtime.sh) traegt die ganze Installation, das master-Image aus dem
  # Release-Weg (`git archive`, LF laut .gitattributes) laeuft, Zweitlauf legt keinen Container neu an, n8n uebersteht
  # einen Neustart, der Rand erreicht n8n, aber weder Postgres noch Gateway, und ein fremder Nachbar-Container samt Volume
  # und Netz bleibt unveraendert (Plan *Wenn Docker schon da ist*).
  # Je Weg nach aussen (lib/reach.sh) ein eigener kalter Lauf: tunnel = echter Tailscale-Container ohne Konto (Anmelde-Link
  # erscheint, nichts wird angemeldet), fritzbox = wan mit internem Zertifikat (*.localhost, keine ACME-Anfrage) samt
  # belegtem Port 80 vorher (nichts wird ueberschrieben). Beide pruefen die Pfad-Liste des Rands und die Tailnet-Sperre.
  compose-stack-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        reach: [tunnel, fritzbox]
    # Wie ein Release: der master kommt per Digest aus einem Register (hier ein lokales registry:2) ueber den Release-Pin in
    # compose.yml, OHNE LA_MASTER_IMAGE in der Umgebung (Form: scripts/lib/release_images.ps1).
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    env:
      LA_PROJECT: ci-lifeagents
      LA_EDGE_PORT: '5880'
      LA_WIZARD_PORT: '5881'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the master image from the release tree, push, write the release pin
        run: |
          set -euo pipefail
          img=127.0.0.1:5000/ci/master
          git archive --format=tar HEAD provisioning packages .gitattributes \
            | docker build -q -f provisioning/compose/master.Dockerfile -t "$img:ci" -
          # CRLF-Fund aus dem Probelauf: ein CR in einem Installer-Skript bricht bash mit pipefail ab.
          crlf="$(docker run --rm --entrypoint sh "$img:ci" -c "grep -rlI \"\$(printf '\r')\" /opt/lifeagents/provisioning || true")"
          [ -z "$crlf" ] || { echo "FAIL CRLF im master-Image:"; echo "$crlf"; exit 1; }
          docker push -q "$img:ci" >/dev/null
          pin="$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$img:ci" | grep -m1 "^$img@sha256:")"
          # Beide erlaubten Formen (contract_lint 33): neutral auf Branches, Release-Pin auf main nach dem Pin-Commit.
          grep -Eq '^  master: &img_master \$\{LA_MASTER_IMAGE(:\?|:-[^}]+/master@sha256:[0-9a-f]{64}\})' provisioning/compose/compose.yml \
            || { echo "FAIL compose.yml ohne erlaubte Pin-Zeile (neutral oder Release-Pin)"; exit 1; }
          sed -i "s|^  master: &img_master .*|  master: \&img_master \${LA_MASTER_IMAGE:-$pin}|" provisioning/compose/compose.yml
          grep -n 'img_master' provisioning/compose/compose.yml
          docker image rm "$img:ci" >/dev/null   # der Stack muss es per Digest aus dem Register ziehen
          echo "MASTER_PIN=$pin" >> "$GITHUB_ENV"

      - name: Neighbour before (foreign container + volume + network, no label of ours)
        run: |
          set -euo pipefail
          docker network create ci-neighbour-net >/dev/null
          docker volume create ci-neighbour-data >/dev/null
          docker run -d --name ci-neighbour --network ci-neighbour-net -v ci-neighbour-data:/data alpine:3.20 \
            sh -c 'echo keep > /data/marker; sleep 3600' >/dev/null
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.before"; cat "$RUNNER_TEMP/neighbour.before"

      - name: Start the stack (volumes, anchor, postgres, master, edge)
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"; echo "::add-mask::$pw"
          echo "LA_PG_SUPERPW=$pw" >> "$GITHUB_ENV"
          LA_PG_SUPERPW="$pw" bash provisioning/compose/stack.sh up
          # master aus dem Pin (Digest), und er kennt sein eigenes Image (master_swap, upgrade_guard brauchen es)
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = "$MASTER_PIN"
          test "$(docker exec "$LA_PROJECT-master" printenv LA_MASTER_IMAGE)" = "$MASTER_PIN"

      - name: Install everything inside the master (provision.sh, all packages, invented values)
        run: |
          set -euo pipefail
          printf "%s\n" \
            "N8N_OWNER_EMAIL='ci@example.com'" \
            "N8N_OWNER_PASSWORD='CiRunner1'" \
            "OWNER_FIRST_NAME='CI'" \
            "OWNER_LAST_NAME='Runner'" \
            "OWNER_BIRTH_DATE='1990-01-01'" \
            "OWNER_LANGUAGE='de'" \
            "REACH_MODE=${{ matrix.reach }}" \
            "LLM_GATEWAY_KEEPALIVE_HOURS=0" > "$RUNNER_TEMP/answers.env"
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/ids.1"
          bash provisioning/compose/stack.sh install "$RUNNER_TEMP/answers.env" --profile dev --packages all

      - name: Assert the stack (doctor, UTF-8, every workflow published, edge reaches only n8n)
        run: |
          set -euo pipefail
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          test "$(q "SELECT pg_encoding_to_char(encoding) FROM pg_database WHERE datname='n8n'")" = UTF8
          total="$(q 'SELECT count(*) FROM public.workflow_entity')"
          unpub="$(q 'SELECT count(*) FROM public.workflow_entity WHERE "activeVersionId" IS NULL')"
          echo "workflows: $total, unpublished: $unpub"
          [ "$total" -ge 100 ] && [ "$unpub" = 0 ] || { echo "FAIL workflows: $total (>= 100), unpublished: $unpub (0)"; exit 1; }
          active="$(q "SELECT count(*) FROM core.package_registry WHERE status='active'")"
          [ "$active" -ge 5 ] || { echo "FAIL active packages: $active (>= 5)"; q "SELECT string_agg(package||'='||status, ',') FROM core.package_registry"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_EDGE_PORT}/healthz" || true)"
          [ "$code" = 200 ] || { echo "FAIL edge /healthz: $code (200)"; exit 1; }
          # Gegenprobe: nc funktioniert, n8n ist erreichbar.
          docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 5678 || { echo "FAIL edge does not reach n8n (anchor:5678)"; exit 1; }
          if docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 8090; then echo "FAIL edge reaches the gateway"; exit 1; fi
          if docker exec "$LA_PROJECT-edge" nc -z -w 2 anchor 5432; then echo "FAIL edge reaches postgres"; exit 1; fi
          # Wizard-Port: der Wizard laeuft im master, bis die App "Fertig" meldet; ohne Einmal-Wert verweigert er /start (403,
          # seine eigene Antwort, nicht die 502 des Rands). Jeder veroeffentlichte Port nur auf 127.0.0.1.
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_WIZARD_PORT}/start" || true)"
          [ "$code" = 403 ] || { echo "FAIL wizard port /start: $code (403 from the wizard)"; exit 1; }
          docker port "$LA_PROJECT-edge" | tee "$RUNNER_TEMP/ports"
          if grep -v ' -> 127\.0\.0\.1:' "$RUNNER_TEMP/ports"; then echo "FAIL edge publishes beyond 127.0.0.1"; exit 1; fi

      - name: Second run is a no-op (no container recreated) and n8n survives a restart
        run: |
          set -euo pipefail
          # Wie `lifeagents update`: ohne --packages -> Grundsystem + die INSTALLIERTEN Pakete (aus der Registry, also ueber
          # den Datenbank-Wrapper des master); keines darf verloren gehen.
          bash provisioning/compose/stack.sh install "$RUNNER_TEMP/answers.env" --profile dev
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT count(*) FROM core.package_registry WHERE status='active'" | tr -d '[:space:]')" -ge 5
          docker ps --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}} {{.ID}}' | sort > "$RUNNER_TEMP/ids.2"
          # n8n, gateway und der Tunnel-Knoten entstehen erst im Erstlauf; wan startet erst im Rand-Schritt.
          grep -v -e '-n8n ' -e '-gateway ' -e '-tailscale ' "$RUNNER_TEMP/ids.1" > "$RUNNER_TEMP/ids.1.base"
          grep -v -e '-n8n ' -e '-gateway ' -e '-tailscale ' "$RUNNER_TEMP/ids.2" > "$RUNNER_TEMP/ids.2.base"
          diff "$RUNNER_TEMP/ids.1.base" "$RUNNER_TEMP/ids.2.base"
          docker restart "$LA_PROJECT-n8n" >/dev/null
          ready=""
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness"; then ready=1; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { docker logs --tail 80 "$LA_PROJECT-n8n"; exit 1; }
          # Ohne Telegram-Token darf nach dem Neustart kein Auth-Fehler auftauchen (AxiosError 401 = Telegram-Trigger
          # mit erfundenem Token, Probelauf-Fund).
          if docker logs --since 5m "$LA_PROJECT-n8n" 2>&1 | grep -q 'AxiosError'; then docker logs --since 5m "$LA_PROJECT-n8n" 2>&1 | tail -40; exit 1; fi
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Edge paths (one public list, editor and wizard closed to the tailnet, proxy hops)
        run: |
          set -euo pipefail
          # Eingang :8088 (Ziel von Funnel und wan) direkt ueber die Container-Adresse des Rands.
          ip="$(docker inspect -f "{{(index .NetworkSettings.Networks \"${LA_PROJECT}_edge_public\").IPAddress}}" "$LA_PROJECT-edge")"
          body() { curl -s --path-as-is --max-time 5 "$@" || true; }
          # Die Liste schreibt der master am Ende der Installation (reach_conf), edge laedt sie binnen 5 s ohne Neustart.
          for _ in $(seq 1 15); do [ "$(body "http://$ip:8088/webhook/ci-nope")" != "Not Found" ] && break; sleep 2; done
          docker exec "$LA_PROJECT-edge" cat /tmp/public.caddy
          # Oeffentlich: landet bei n8n (JSON-Antwort von n8n), nie die 404 des Rands ("Not Found" als Klartext).
          for p in /webhook/ci-nope /webhook-test/ci-nope /webhook-waiting/ci-nope; do
            b="$(body "http://$ip:8088$p")"; echo "$p -> ${b:0:80}"
            [ -n "$b" ] && [ "$b" != "Not Found" ] || { echo "FAIL $p erreicht n8n nicht"; exit 1; }
          done
          b="$(body -X POST -H 'Content-Type: application/json' --data '{}' "http://$ip:8088/webhook-waiting-telegram")"
          [ "$b" != "Not Found" ] || { echo "FAIL /webhook-waiting-telegram gesperrt"; exit 1; }
          # Gesperrt: Editor, REST, API, Gesundheit, Wizard-Pfade, Tricks mit .. und Kodierung -> genau die 404 des Rands.
          for p in / /rest/settings /rest/login /api/v1/workflows /healthz /signin /start /webhook /webhook-waiting-telegramx \
                   /webhook/../rest/settings /webhook/%2e%2e/rest/settings /webhook%2f..%2frest%2fsettings; do
            b="$(body "http://$ip:8088$p")"
            [ "$b" = "Not Found" ] || { echo "FAIL $p ist oeffentlich: ${b:0:120}"; exit 1; }
          done
          # Tailnet simuliert: Tailscale (Userspace) reicht Tailnet-Zugriffe auf 127.0.0.1 im Namensraum des Rands weiter.
          # Editor :8080 und Wizard :8081 muessen von dort scheitern, :8088 (die Liste) muss gehen.
          if docker exec "$LA_PROJECT-edge" wget -q -O /dev/null -T 3 http://127.0.0.1:8080/healthz; then echo "FAIL Editor aus dem Namensraum erreichbar"; exit 1; fi
          # Gesperrt heisst: es kommt gar keine HTTP-Antwort (abort), weder vom Wizard noch eine 502 des Rands.
          wz="$(docker exec "$LA_PROJECT-edge" wget -q -O /dev/null -T 3 http://127.0.0.1:8081/ 2>&1 || true)"
          if printf '%s' "$wz" | grep -q 'HTTP/'; then echo "FAIL Wizard-Eingang antwortet aus dem Namensraum: $wz"; exit 1; fi
          # Gegenprobe: ueber den veroeffentlichten Port antwortet der Wizard (403 ohne Einmal-Wert).
          wz="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_WIZARD_PORT}/start" || true)"
          [ "$wz" = 403 ] || { echo "FAIL wizard port /start from the host: $wz (403)"; exit 1; }
          # Ueber den veroeffentlichten Port (Rechner) bleibt der Editor erreichbar.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LA_EDGE_PORT}/healthz")" = 200
          docker exec "$LA_PROJECT-master" grep -qx 'N8N_PROXY_HOPS=2' /etc/n8n/n8n.env
          docker exec "$LA_PROJECT-master" grep -qx 'REACH_MODE=${{ matrix.reach }}' /etc/lifeagents/core.env

      - name: Tunnel (Tailscale without an account -> login link, same namespace as the edge)
        if: matrix.reach == 'tunnel'
        run: |
          set -euo pipefail
          edge_id="$(docker inspect -f '{{.Id}}' "$LA_PROJECT-edge")"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$LA_PROJECT-tailscale")" = "container:$edge_id"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$LA_PROJECT-tailscale" | grep -qx 'TS_HOSTNAME=bot'
          # Wizard und App fragen den Stand ueber reach_ctl.sh status (eine JSON-Zeile).
          st=''
          for _ in $(seq 1 45); do
            st="$(docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh status)"
            [ "$(printf '%s' "$st" | jq -r .state)" = needs_login ] && break
            sleep 2
          done
          echo "$st"
          test "$(printf '%s' "$st" | jq -r .state)" = needs_login
          printf '%s' "$st" | jq -er '.url | test("^https://login\\.tailscale\\.com/")' >/dev/null
          test "$(printf '%s' "$st" | jq -r .mode)" = tunnel
          # Ohne Anmeldung gibt es keine Internet-Adresse: DOMAIN bleibt leer.
          if docker exec "$LA_PROJECT-master" grep -q '^DOMAIN=.' /etc/lifeagents/core.env; then echo "FAIL DOMAIN ohne Tunnel gesetzt"; exit 1; fi
          # Tailnet-Zugriff aus dem Tailscale-Container selbst (derselbe Namensraum): Editor gesperrt.
          if docker exec "$LA_PROJECT-tailscale" wget -q -O /dev/null -T 3 http://127.0.0.1:8080/healthz; then echo "FAIL Editor vom Tailscale-Knoten erreichbar"; exit 1; fi
          if docker ps --format '{{.Names}}' | grep -qx "$LA_PROJECT-wan"; then echo "FAIL wan laeuft beim Tunnel-Weg"; exit 1; fi
          # Neuer Link ohne Zuruecksetzen des Knotens.
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh relogin >/dev/null

      - name: FritzBox (ports 80/443 checked first, wan with internal certificate, nothing overwritten)
        if: matrix.reach == 'fritzbox'
        run: |
          set -euo pipefail
          lib='. /opt/lifeagents/provisioning/lib/common.sh'
          st() { docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/compose/reach_ctl.sh status; }
          # Ohne Internet-Adresse startet nichts.
          test "$(st | jq -r .reason)" = no_domain
          docker exec "$LA_PROJECT-master" bash -c "$lib; env_upsert /etc/lifeagents/core.env DOMAIN ci-edge.localhost"
          # Port 80 belegt (fremder Nachbar): wan startet nicht, der Nachbar bleibt, Status raet zum Tunnel.
          docker run -d --name ci-port80 -p 80:80 busybox:1.37 httpd -f -p 80 >/dev/null
          before="$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' ci-port80)"
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          if docker ps --format '{{.Names}}' | grep -qx "$LA_PROJECT-wan"; then echo "FAIL wan trotz belegtem Port 80"; exit 1; fi
          test "$(st | jq -r .state)" = ports_busy
          test "$(docker inspect -f '{{.Id}} {{.State.StartedAt}}' ci-port80)" = "$before"
          docker rm -fv ci-port80 >/dev/null
          # Frei: wan startet, Zertifikat intern (*.localhost), alles geht an die Pfad-Liste des Rands.
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          ok=''
          for _ in $(seq 1 30); do
            if curl -sk --max-time 3 --resolve ci-edge.localhost:443:127.0.0.1 -o /dev/null https://ci-edge.localhost/webhook/ci-nope; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs --tail 40 "$LA_PROJECT-wan"; exit 1; }
          w() { curl -sk --path-as-is --max-time 5 --resolve ci-edge.localhost:443:127.0.0.1 "https://ci-edge.localhost$1" || true; }
          b="$(w /webhook/ci-nope)"; [ -n "$b" ] && [ "$b" != "Not Found" ]
          for p in / /rest/settings /healthz /webhook/../rest/settings; do test "$(w "$p")" = "Not Found"; done
          # Port 80 leitet auf HTTPS um (und dient der Zertifikats-Abfrage).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci-edge.localhost' http://127.0.0.1/)" = 308
          test "$(st | jq -r .state)" = pending_activation
          # Zweiter Converge ist still (kein Neustart von wan).
          s1="$(docker inspect -f '{{.State.StartedAt}}' "$LA_PROJECT-wan")"
          docker exec "$LA_PROJECT-master" bash -c "$lib; DOMAIN=ci-edge.localhost reach_converge"
          test "$(docker inspect -f '{{.State.StartedAt}}' "$LA_PROJECT-wan")" = "$s1"

      - name: Neighbour after (unchanged)
        run: |
          set -euo pipefail
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.after"
          diff "$RUNNER_TEMP/neighbour.before" "$RUNNER_TEMP/neighbour.after"

      - name: Logs on failure
        if: failure()
        run: |
          for c in master n8n postgres gateway edge tailscale wan; do echo "=== $c"; docker logs --tail 60 "$LA_PROJECT-$c" 2>&1 || true; done

      - name: Teardown (only our project + the neighbour)
        if: always()
        run: |
          docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml --profile tunnel --profile fritzbox down --remove-orphans || true
          docker rm -fv ci-port80 >/dev/null 2>&1 || true
          # Liste aus der einen Adresse (lib/runtime.sh LA_STATE_VOLUMES), nie hier gespiegelt.
          for v in $(sed -n 's/^LA_STATE_VOLUMES="\(.*\)"$/\1/p' provisioning/lib/runtime.sh); do docker volume rm "${LA_PROJECT}_$v" >/dev/null 2>&1 || true; done
          docker rm -fv ci-neighbour >/dev/null 2>&1 || true
          docker volume rm ci-neighbour-data >/dev/null 2>&1 || true
          docker network rm ci-neighbour-net >/dev/null 2>&1 || true

  # Laufzeit im Docker-Verbund (Paket 2): Versionssprung als master-Image-Wechsel ueber den Helfer (lib/master_swap.sh) mit
  # Abbruch je Schritt — Image nicht ladbar / neues Image kaputt (Rueckweg des Helfers) / Einrichtung scheitert nach der
  # Sicherung (lifeagents rollback --yes: Daten zurueck + master zurueck) —, die Tick-Schleife statt der Update-Timer, die
  # CLI ueberlebt jede Neuanlage des master, Sicherung in einen Ordner AUF DEM RECHNER + Restore, doctor misst Namensraum und
  # Netz-Grenze, Deinstallation ohne und mit Daten neben einem Nachbarn (Vorher-Nachher gleich). Kern-Installation
  # (--packages none) haelt den Lauf kurz; alle Pakete prueft compose-stack-cold.
  compose-stack-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LA_PROJECT: ci-ops
      LA_EDGE_PORT: '5890'
      LA_WIZARD_PORT: '5891'
      LA_MASTER_IMAGE: ci-ops-master:a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build master images (a = release tree, b = newer, c = broken, d = setup fails after the backup)
        run: |
          set -euo pipefail
          git archive --format=tar HEAD provisioning packages .gitattributes \
            | docker build -q -f provisioning/compose/master.Dockerfile -t ci-ops-master:a -
          printf 'FROM ci-ops-master:a\nLABEL io.lifeagents.ci=b\n' | docker build -q -t ci-ops-master:b -
          printf 'FROM ci-ops-master:a\nRUN rm /usr/bin/jq\n' | docker build -q -t ci-ops-master:c -
          printf '%s\n' 'FROM ci-ops-master:b' \
            "RUN printf '\\nupgrade_finish() { die \"CI: Fehler nach der Sicherung\"; }\\n' >> /opt/lifeagents/provisioning/lib/upgrade_guard.sh" \
            | docker build -q -t ci-ops-master:d -
          docker run --rm --entrypoint tail ci-ops-master:d -n 2 /opt/lifeagents/provisioning/lib/upgrade_guard.sh

      - name: Neighbour before (foreign container, volume, network + a decoy volume with our prefix but no label)
        run: |
          set -euo pipefail
          docker network create ci-neighbour-net >/dev/null
          docker volume create ci-neighbour-data >/dev/null
          docker volume create "${LA_PROJECT}_fremd" >/dev/null
          docker run -d --name ci-neighbour --network ci-neighbour-net -v ci-neighbour-data:/data alpine:3.20 \
            sh -c 'echo keep > /data/marker; sleep 3600' >/dev/null
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data "${LA_PROJECT}_fremd"
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.before"; cat "$RUNNER_TEMP/neighbour.before"

      - name: Install the core (release v9.0.0 on image a), CLI + tick loop alive
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"; echo "::add-mask::$pw"
          echo "LA_PG_SUPERPW=$pw" >> "$GITHUB_ENV"
          export LA_PG_SUPERPW="$pw"
          bash provisioning/compose/stack.sh up
          printf "%s\n" "N8N_OWNER_EMAIL='ci@example.com'" "N8N_OWNER_PASSWORD='CiRunner1'" "OWNER_FIRST_NAME='CI'" \
            "OWNER_LAST_NAME='Runner'" "OWNER_BIRTH_DATE='1990-01-01'" "OWNER_LANGUAGE='de'" "LLM_GATEWAY_KEEPALIVE_HOURS=0" \
            | docker exec -i "$LA_PROJECT-master" sh -c 'umask 077; cat > /root/answers.env'
          docker exec -e RELEASE_TAG=v9.0.0 "$LA_PROJECT-master" \
            bash /opt/lifeagents/provisioning/provision.sh --unattended /root/answers.env --profile dev --packages none
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.0.0
          docker exec "$LA_PROJECT-master" test -L /usr/local/bin/lifeagents
          # Die Tick-Schleife laeuft neben dem Wizard (der hier nie "Fertig" bekommt) und schreibt binnen einer Minute.
          for _ in $(seq 1 30); do docker exec "$LA_PROJECT-master" grep -q '^LAST_TICK=' /var/lib/lifeagents/update-tick.state 2>/dev/null && break; sleep 5; done
          docker exec "$LA_PROJECT-master" cat /var/lib/lifeagents/update-tick.state \
            || { echo "FAIL tick loop wrote no update-tick.state within 150 s"; docker top "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Backup to a folder on the host + restore (Fund 7)
        run: |
          set -euo pipefail
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "$1" | tr -d '[:space:]'; }
          mkdir -p "$RUNNER_TEMP/bk"
          docker exec "$LA_PROJECT-master" lifeagents backup host-dir "$RUNNER_TEMP/bk"
          q "INSERT INTO agent.core_contexts (name, description, managed_by, content) VALUES ('ci_restore_probe', 'CI', 'agent', 'vorher')" >/dev/null
          docker exec "$LA_PROJECT-master" lifeagents backup export
          sudo ls -l "$RUNNER_TEMP/bk"
          name="$(sudo find "$RUNNER_TEMP/bk" -maxdepth 1 -name 'lifeagents-backup-*.nla.enc' -printf '%f\n' | head -n1)"
          [ -n "$name" ]
          # Auf der Docker-Platte liegt keine Kopie: die Sicherung steht nur im Rechner-Ordner.
          if docker exec "$LA_PROJECT-master" sh -c 'ls /root/*.nla.enc /opt/lifeagents/*.nla.enc 2>/dev/null' | grep -q .; then echo "FAIL Kopie im master"; exit 1; fi
          q "UPDATE agent.core_contexts SET content = 'nachher' WHERE name = 'ci_restore_probe'" >/dev/null
          docker exec "$LA_PROJECT-master" lifeagents backup restore "$name" --yes
          test "$(q "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'")" = vorher

      - name: Version jump, abort 1 — the new master image cannot be loaded (nothing changes)
        run: |
          set -euo pipefail
          if docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:gibt-es-nicht'; then
            echo "FAIL Wechsel ohne ladbares Image lief"; exit 1
          fi
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state
          test "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master")" = ci-ops-master:a

      - name: Version jump, abort 2 — the new master image is broken (helper rolls back)
        run: |
          set -euo pipefail
          docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:c'
          done=""
          for _ in $(seq 1 60); do
            img="$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null || true)"
            if [ "$img" = ci-ops-master:a ] && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 40 "$LA_PROJECT-master"; exit 1; }
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.0.0
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Version jump a -> b (helper swaps, the new master sets up v9.1.0 after a backup)
        run: |
          set -euo pipefail
          docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.1.0 "$LA_COMPOSE_FILE" ci-ops-master:b'
          done=""
          for _ in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null)" = ci-ops-master:b ] \
               && [ "$(docker exec "$LA_PROJECT-master" lifeagents version 2>/dev/null)" = v9.1.0 ] \
               && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" sh -c 'ls -l /var/lib/lifeagents/backups/pre-upgrade-*.dump.gpg'
          sudo find "$RUNNER_TEMP/bk" -maxdepth 1 -name 'pre-upgrade-*.dump.gpg' | grep -q .
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/upgrade.pending
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Version jump, abort 3 — setup fails after the backup, then lifeagents rollback --yes (data + master back)
        run: |
          set -euo pipefail
          q() { docker exec "$LA_PROJECT-postgres" psql -U postgres -d postgres -tAc "$1" | tr -d '[:space:]'; }
          docker exec "$LA_PROJECT-master" bash -c '. /opt/lifeagents/provisioning/lib/common.sh; . /opt/lifeagents/provisioning/lib/master_swap.sh; master_swap_begin v9.2.0 "$LA_COMPOSE_FILE" ci-ops-master:d'
          done=""
          for _ in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null)" = ci-ops-master:d ] \
               && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" test -e /var/lib/lifeagents/upgrade.pending   # gescheitert NACH der Sicherung
          test "$(docker exec "$LA_PROJECT-master" lifeagents version)" = v9.1.0
          grep -q '^FROM_MASTER_IMAGE=ci-ops-master:b$' <(docker exec "$LA_PROJECT-master" cat /var/lib/lifeagents/upgrade.pending)
          docker exec "$LA_PROJECT-master" lifeagents rollback --yes
          done=""
          for _ in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.Config.Image}}' "$LA_PROJECT-master" 2>/dev/null)" = ci-ops-master:b ] \
               && docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/master-swap/state 2>/dev/null \
               && [ -z "$(q "SELECT 1 FROM pg_database WHERE datname = 'n8n_before_rollback'")" ]; then done=1; break; fi
            sleep 5
          done
          [ -n "$done" ] || { docker logs --tail 60 "$LA_PROJECT-master"; exit 1; }
          docker exec "$LA_PROJECT-master" test ! -e /var/lib/lifeagents/upgrade.pending
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'" | tr -d '[:space:]')" = vorher
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: doctor sees a separated namespace after a lone anchor restart (Einwand 17)
        run: |
          set -euo pipefail
          docker restart "$LA_PROJECT-anchor" >/dev/null
          out="$(docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh || true)"
          printf '%s\n' "$out" | grep 'Netz-Namensraum getrennt'
          docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml restart anchor >/dev/null   # restart: true im Pod zieht die Mitglieder nach
          for _ in $(seq 1 60); do curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${LA_EDGE_PORT}/healthz/readiness" && break; sleep 3; done
          docker exec "$LA_PROJECT-master" bash /opt/lifeagents/provisioning/doctor.sh

      - name: Uninstall keeping data, data is found again; uninstall with data; neighbour unchanged
        run: |
          set -euo pipefail
          bash provisioning/compose/stack.sh uninstall
          test -z "$(docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}}')"
          docker volume inspect "${LA_PROJECT}_pgdata" >/dev/null
          bash provisioning/compose/stack.sh up
          test "$(docker exec "$LA_PROJECT-postgres" psql -U postgres -d n8n -tAc "SELECT content FROM agent.core_contexts WHERE name = 'ci_restore_probe'" | tr -d '[:space:]')" = vorher
          bash provisioning/compose/stack.sh uninstall --delete-data
          test -z "$(docker ps -a --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Names}}')"
          test -z "$(docker volume ls --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Name}}')"
          test -z "$(docker network ls --filter "label=io.lifeagents.install=$LA_PROJECT" --format '{{.Name}}')"
          state() {
            docker inspect -f '{{.Id}} {{.State.StartedAt}} {{.RestartCount}} {{.State.Status}}' ci-neighbour
            docker volume inspect -f '{{.Name}} {{.CreatedAt}}' ci-neighbour-data "${LA_PROJECT}_fremd"
            docker network inspect -f '{{.Id}}' ci-neighbour-net
            docker exec ci-neighbour cat /data/marker
          }
          state > "$RUNNER_TEMP/neighbour.after"
          diff "$RUNNER_TEMP/neighbour.before" "$RUNNER_TEMP/neighbour.after"

      - name: Logs on failure
        if: failure()
        run: |
          for c in master n8n postgres gateway edge swap; do echo "=== $c"; docker logs --tail 80 "$LA_PROJECT-$c" 2>&1 || true; done
          docker exec "$LA_PROJECT-master" sh -c 'cat /var/lib/lifeagents/master-swap/state; tail -n 60 /var/lib/lifeagents/log/*.log' 2>&1 || true

      - name: Teardown (only our project + the neighbour)
        if: always()
        run: |
          docker compose -p "$LA_PROJECT" -f provisioning/compose/compose.yml down --remove-orphans || true
          docker rm -fv "$LA_PROJECT-swap" >/dev/null 2>&1 || true
          docker volume rm "${LA_PROJECT}_fremd" "${LA_PROJECT}_shared" "${LA_PROJECT}_gw_code" "${LA_PROJECT}_n8n_patches" >/dev/null 2>&1 || true
          # Liste aus der einen Adresse (lib/runtime.sh LA_STATE_VOLUMES), nie hier gespiegelt.
          for v in $(sed -n 's/^LA_STATE_VOLUMES="\(.*\)"$/\1/p' provisioning/lib/runtime.sh); do docker volume rm "${LA_PROJECT}_$v" >/dev/null 2>&1 || true; done
          docker rm -fv ci-neighbour >/dev/null 2>&1 || true
          docker volume rm ci-neighbour-data >/dev/null 2>&1 || true
          docker network rm ci-neighbour-net >/dev/null 2>&1 || true
