# Linux-Einstieg auf frischem Debian 12 (Paket L2): ein Debian-Cloud-Image laeuft als KVM-VM auf dem ubuntu-24.04-Runner, mit
# LANG=C wie eine Proxmox-Vorlage und ohne vorinstalliertes Docker. Darin laeuft der echte Einstieg provisioning/setup.sh (Docker holen,
# Kern starten), danach klickt ein Browser (Playwright) den Einrichtungs-Fragebogen mit erfundenen Werten komplett durch; am Ende
# Kopplung und Kontrolle (n8n antwortet, doctor, Workflows), Zweitlauf von setup.sh ohne Aenderung, Abbau ohne Reste. Ablauf und Grenzen
# (Telegram-Attrappe, gesperrtes Anthropic, Kopplung per Webhook, Tunnel-Anmeldung) stehen im Kopf von tests/install/debian_vm.sh.
# Rot ohne /dev/kvm = Runner-Ausfall (Meldung im Schritt "KVM"), Lauf wiederholen. Kein Required Check.
# Secrets TEST_TELEGRAM_BOT_TOKEN (echter Test-Bot), TEST_ANTHROPIC_API_KEY, TEST_TS_AUTHKEY (ephemeres Test-Tailscale): nur in den
# Schritten, die sie brauchen, und nur bei schedule/workflow_dispatch/workflow_call und dem Bau-Push dieses Branches (kein pull_request-Ausloeser;
# Fork-PRs bekaemen sie ohnehin nicht). Gesetzt = echter Weg, leer = Attrappen und Erfundenes (Grenzen im Kopf von debian_vm.sh).
# Nie ausgeben: debian_vm.sh maskiert sie, der Klicker tippt sie nur in den Browser, mit echten Zugaengen entstehen keine Bilder.
name: linux-setup-debian

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
  workflow_call:
  # Nur waehrend des Baus: workflow_dispatch startet nur Dateien auf dem Default-Branch. Faellt mit dem Branch weg.
  push:
    branches: [feat/s4-l2-debian-269b9b]
    paths: ['.github/workflows/linux-setup-debian.yml', 'tests/install/**']

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: KVM (Runner-Ausfall, wenn es fehlt)
        run: bash tests/install/debian_vm.sh kvm

      - name: Build the master image and serve it from a registry without Docker (crane)
        run: bash tests/install/debian_vm.sh registry

      - name: Download Debian 12 cloud image (latest, checksum) and prepare disk and cloud-init seed (LANG=C)
        run: bash tests/install/debian_vm.sh image

      - name: Boot the VM and wait for SSH and cloud-init
        timeout-minutes: 10
        run: bash tests/install/debian_vm.sh boot

      - name: setup.sh --yes on the cold Debian (installs Docker from the repo, starts the core, prints SSH command and link)
        timeout-minutes: 30
        run: bash tests/install/debian_vm.sh setup

      - name: Real test accounts if the secrets exist, else stand-ins (Telegram mock, questionnaire with the test switch, Anthropic blocked)
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          TEST_TS_AUTHKEY: ${{ secrets.TEST_TS_AUTHKEY }}
        run: bash tests/install/debian_vm.sh mocks

      - name: Link and tunnel like an owner's laptop; install the browser
        run: |
          set -euo pipefail
          bash tests/install/debian_vm.sh link
          bash tests/install/debian_vm.sh tunnel
          node --version
          npm ci --no-audit --no-fund --prefix tests/install
          npx --prefix tests/install playwright install --with-deps chromium

      - name: Test bot without a leftover webhook (only with the real test bot)
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
        run: bash tests/install/debian_vm.sh tgreset

      - name: Click through the questionnaire (all pages) up to the Connect page, installation included
        env:
          KLICK_TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          KLICK_ANTHROPIC_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          KLICK_SHOT: ${{ (secrets.TEST_TELEGRAM_BOT_TOKEN != '' || secrets.TEST_ANTHROPIC_API_KEY != '') && '0' || '1' }}
        timeout-minutes: 50
        run: |
          set -euo pipefail
          export KLICK_URL
          KLICK_URL="$(cat "$RUNNER_TEMP/klick.url")"
          export KLICK_OUT="$RUNNER_TEMP/klick-out"
          node tests/install/wizard_klick.cjs

      - name: Pair the owner over the real ingress and finish (Telegram mock; the Tailscale login of the Connect page needs an account)
        timeout-minutes: 15
        run: bash tests/install/debian_vm.sh pair

      - name: End check (n8n answers, stack healthy, doctor, workflows published)
        run: bash tests/install/debian_vm.sh verify

      - name: A second setup.sh run changes nothing
        run: bash tests/install/debian_vm.sh second

      - name: Uninstall with data leaves nothing behind
        run: bash tests/install/debian_vm.sh uninstall

      - name: Summary (times per phase)
        if: always()
        run: bash tests/install/debian_vm.sh summary

      - name: Diagnostics on failure (VM console, containers, wizard log)
        if: failure()
        run: bash tests/install/debian_vm.sh diag

      - name: Screenshots of the questionnaire pages (invented values only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klick-out
          path: ${{ runner.temp }}/klick-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Test bot without a leftover webhook after the run
        if: always()
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
        run: bash tests/install/debian_vm.sh tgreset

      - name: Stop the VM
        if: always()
        run: bash tests/install/debian_vm.sh stop
