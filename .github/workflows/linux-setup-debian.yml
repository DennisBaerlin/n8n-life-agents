# Linux-Einstieg auf frischem Debian 12: ein Debian-Cloud-Image laeuft als KVM-VM auf dem ubuntu-24.04-Runner, mit LANG=C wie
# eine Proxmox-Vorlage und ohne vorinstalliertes Docker. Darin laeuft der echte Einstieg provisioning/setup.sh. Zwei Jobs, ein Skript
# (tests/install/debian_vm.sh, dort Ablauf und Grenzen):
#   klick   - Fragebogen im Browser (Playwright) mit erfundenen Werten, Telegram-Attrappe; keine Secrets, kein Environment.
#   answers - Antwort-Datei-Weg ohne Fragebogen mit den echten Test-Zugaengen: Tailscale-Tunnel (Funnel), Test-Bot, Anthropic-Schluessel;
#             prueft Tunnel ready, getWebhookInfo, oeffentlichen Pfad, Kosten 0; danach Zweitlauf, Abbau, Abmelden.
# Secrets nur ueber das Environment install-test (Branch-Regel main), nur im env: des einen Schritts "answers", nur bei
# schedule/workflow_dispatch, kein Artefakt-Upload. Schnittstelle:
# docs/reference/tests.md *Test-Zugaenge*.
# Rot ohne /dev/kvm = Runner-Ausfall (Meldung im Schritt "KVM"), Lauf wiederholen. Kein Required Check.
name: linux-setup-debian

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Der Test-Bot hat genau einen Webhook und das Test-Tailnet einen Namen je Lauf: zwei Laeufe gleichzeitig kaemen sich in die Quere.
concurrency:
  group: install-test
  cancel-in-progress: false

jobs:
  klick:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: KVM (Runner-Ausfall, wenn es fehlt)
        run: bash tests/install/debian_vm.sh kvm

      - name: Build the master image and serve it from a registry without Docker (crane)
        run: bash tests/install/debian_vm.sh registry

      - name: Download Debian 12 cloud image (latest, checksum) and prepare disk and cloud-init seed (LANG=C)
        run: bash tests/install/debian_vm.sh image

      - name: Boot the VM and wait for SSH and cloud-init
        timeout-minutes: 10
        run: bash tests/install/debian_vm.sh boot

      - name: setup.sh --yes on the cold Debian (installs Docker from the repo, starts the core, prints SSH command and link)
        timeout-minutes: 30
        run: bash tests/install/debian_vm.sh setup

      - name: Stand-ins for what the run does not have (Telegram mock, questionnaire with the test switch, Anthropic blocked)
        run: bash tests/install/debian_vm.sh mocks

      - name: Link and tunnel like an owner's laptop; install the browser
        run: bash tests/install/debian_vm.sh browser

      - name: Click through the questionnaire (all pages) via the Tailscale page and the FritzBox way up to the Connect page, installation included
        timeout-minutes: 50
        env:
          KLICK_SHOT: '0'
        run: bash tests/install/debian_vm.sh klick

      - name: Pair the owner over the real ingress and finish (Telegram mock)
        timeout-minutes: 15
        run: bash tests/install/debian_vm.sh pair

      - name: End check (n8n answers, stack healthy, doctor, workflows published)
        run: bash tests/install/debian_vm.sh verify

      - name: A second setup.sh run changes nothing
        run: bash tests/install/debian_vm.sh second

      - name: Uninstall with data leaves nothing behind
        run: bash tests/install/debian_vm.sh uninstall

      - name: Summary (times per phase)
        if: always()
        run: bash tests/install/debian_vm.sh summary

      - name: Diagnostics on failure (VM console, containers, wizard log)
        if: failure()
        run: bash tests/install/debian_vm.sh diag

      - name: Stop the VM
        if: always()
        run: bash tests/install/debian_vm.sh stop

  answers:
    runs-on: ubuntu-24.04
    environment: install-test
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: KVM (Runner-Ausfall, wenn es fehlt)
        run: bash tests/install/debian_vm.sh kvm

      - name: Build the master image and serve it from a registry without Docker (crane)
        run: bash tests/install/debian_vm.sh registry

      - name: Download Debian 12 cloud image (latest, checksum) and prepare disk and cloud-init seed (LANG=C)
        run: bash tests/install/debian_vm.sh image

      - name: Boot the VM and wait for SSH and cloud-init
        timeout-minutes: 10
        run: bash tests/install/debian_vm.sh boot

      # Der eine Schritt mit den Secrets: der Helfer holt per OAuth einen frischen Tailscale-Schluessel (1 h, einmalig) und schreibt die
      # Antwort-Datei; die Folgeschritte lesen nur diese Datei.
      - name: Answers file from the helper (test bot, Anthropic key, fresh Tailscale key)
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          TEST_TS_OAUTH_CLIENT_ID: ${{ secrets.TEST_TS_OAUTH_CLIENT_ID }}
          TEST_TS_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_TS_OAUTH_CLIENT_SECRET }}
        run: bash tests/install/debian_vm.sh answers

      - name: setup.sh --answers on the cold Debian (unattended install with the tunnel and the test bot)
        timeout-minutes: 40
        run: bash tests/install/debian_vm.sh setup_answers

      - name: Tunnel, webhook and cost checks (ready, ts.net address, getWebhookInfo, public path, no Anthropic calls)
        timeout-minutes: 30
        run: bash tests/install/debian_vm.sh reach

      - name: End check (n8n answers, stack healthy, doctor, workflows published)
        env:
          MIN_WORKFLOWS: '30'
        run: bash tests/install/debian_vm.sh verify

      - name: A second setup.sh run changes nothing
        run: bash tests/install/debian_vm.sh second

      - name: Uninstall with data leaves nothing behind (signs the tunnel device out first)
        run: bash tests/install/debian_vm.sh uninstall

      - name: Summary (times per phase)
        if: always()
        run: bash tests/install/debian_vm.sh summary

      - name: Diagnostics on failure (VM console, containers, wizard log)
        if: failure()
        run: bash tests/install/debian_vm.sh diag

      - name: Clean up (tunnel device, webhook of the test bot, answers files)
        if: always()
        run: bash tests/install/debian_vm.sh answers_cleanup

      - name: Stop the VM
        if: always()
        run: bash tests/install/debian_vm.sh stop
