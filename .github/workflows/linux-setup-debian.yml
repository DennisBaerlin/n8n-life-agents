# Linux-Einstieg auf frischem Debian 12 (Paket L2), echter Weg: ein Debian-Cloud-Image laeuft als KVM-VM auf dem ubuntu-24.04-Runner,
# mit LANG=C wie eine Proxmox-Vorlage und ohne vorinstalliertes Docker. Darin laeuft der echte Einstieg provisioning/setup.sh (Docker
# holen, Kern starten), danach klickt ein Browser (Playwright) den Einrichtungs-Fragebogen durch; am Ende Kopplung und Kontrolle
# (n8n antwortet, doctor, Workflows), Zweitlauf von setup.sh ohne Aenderung, Abbau ohne Reste. Ablauf und Grenzen (Telegram-Attrappe,
# gesperrtes Anthropic, Kopplung per Webhook, Tunnel-Anmeldung) stehen im Kopf von tests/install/debian_vm.sh.
# Secrets TEST_TELEGRAM_BOT_TOKEN, TEST_ANTHROPIC_API_KEY, TEST_TS_AUTHKEY nur ueber das Environment install-test (Branch-Regel main),
# nur im env: der Schritte, die sie brauchen, nur bei schedule/workflow_dispatch/workflow_call, kein Artefakt-Upload in diesem Job.
# Gesetzt = echter Weg, leer = Attrappen und Erfundenes. Den Lauf auf Entwicklungs-Branches ohne Secrets fuehrt linux-setup-debian-build.yml.
# Rot ohne /dev/kvm = Runner-Ausfall (Meldung im Schritt "KVM"), Lauf wiederholen. Kein Required Check.
name: linux-setup-debian

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Der Test-Bot hat genau einen Webhook: zwei Laeufe gleichzeitig nahmen ihn sich gegenseitig weg.
concurrency:
  group: install-test
  cancel-in-progress: false

jobs:
  debian:
    runs-on: ubuntu-24.04
    environment: install-test
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: KVM (Runner-Ausfall, wenn es fehlt)
        run: bash tests/install/debian_vm.sh kvm

      - name: Build the master image and serve it from a registry without Docker (crane)
        run: bash tests/install/debian_vm.sh registry

      - name: Download Debian 12 cloud image (latest, checksum) and prepare disk and cloud-init seed (LANG=C)
        run: bash tests/install/debian_vm.sh image

      - name: Boot the VM and wait for SSH and cloud-init
        timeout-minutes: 10
        run: bash tests/install/debian_vm.sh boot

      - name: setup.sh --yes on the cold Debian (installs Docker from the repo, starts the core, prints SSH command and link)
        timeout-minutes: 30
        run: bash tests/install/debian_vm.sh setup

      - name: Real test accounts if the secrets exist, else stand-ins (Telegram mock, questionnaire with the test switch, Anthropic blocked)
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          TEST_TS_AUTHKEY: ${{ secrets.TEST_TS_AUTHKEY }}
        run: bash tests/install/debian_vm.sh mocks

      - name: Link and tunnel like an owner's laptop; install the browser
        run: bash tests/install/debian_vm.sh browser

      - name: Test bot without a leftover webhook (only with the real test bot)
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
        run: bash tests/install/debian_vm.sh tgreset

      - name: Click through the questionnaire (all pages) via the Tailscale page and the FritzBox way up to the Connect page, installation included
        timeout-minutes: 50
        env:
          KLICK_TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          KLICK_ANTHROPIC_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
          KLICK_SHOT: '0'
        run: bash tests/install/debian_vm.sh klick

      - name: Pair the owner over the real ingress and finish (Telegram mock)
        timeout-minutes: 15
        run: bash tests/install/debian_vm.sh pair

      - name: End check (n8n answers, stack healthy, doctor, workflows published)
        run: bash tests/install/debian_vm.sh verify

      - name: A second setup.sh run changes nothing
        run: bash tests/install/debian_vm.sh second

      - name: Uninstall with data leaves nothing behind
        run: bash tests/install/debian_vm.sh uninstall

      - name: Summary (times per phase)
        if: always()
        run: bash tests/install/debian_vm.sh summary

      - name: Diagnostics on failure (VM console, containers, wizard log)
        if: failure()
        run: bash tests/install/debian_vm.sh diag

      - name: Test bot without a leftover webhook after the run
        if: always()
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
        run: bash tests/install/debian_vm.sh tgreset

      - name: Stop the VM
        if: always()
        run: bash tests/install/debian_vm.sh stop
