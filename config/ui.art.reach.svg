<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" width="280" height="560" role="img" data-compact-height="452" data-scenes="4" data-scene-s="3.5">
  <!-- Wege ins Internet: Quelle für die Wizard-Seite reach (hochkant neben den Antwortkarten, Bild wechselt mit der Auswahl) und
       die Weg-Seiten der Anleitung. Varianten tunnel / fritzbox / proxy (data-variant), Generator scripts/build_ui_tokens.ps1,
       Format scripts/lib/ui_art.ps1. Szenen: 1 Handy, 2 Telegram, 3 der gewählte Weg, 4 dein Rechner.
       Kein Telegram- oder Hersteller-Logo: Internet = Wolke. Hochkant, weil der Wizard das Bild neben die Karten stellt.
       Breite 280: Der Wizard zeigt das Bild 200 px breit, die Anleitung bis 300 px; die Schrift (19) landet so nahe Fließtext. -->
  <style>
    text { font-family: var(--font); fill: var(--ink); }
    .cap { font-size: 17px; text-anchor: middle; }
    .lbl { font-size: 19px; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .dot { opacity: 0; }
    @keyframes dot {
      0% { opacity: 0; transform: translateY(0); }
      2% { opacity: 1; transform: translateY(0); }
      22%, 27% { opacity: 1; transform: translateY(68px); }
      47%, 52% { opacity: 1; transform: translateY(188px); }
      72%, 74% { opacity: 1; transform: translateY(294px); }
      76%, 100% { opacity: 0; transform: translateY(294px); }
    }
    @media (prefers-reduced-motion: no-preference) { .dot { animation: dot 14s linear infinite; } }
  </style>

  <path d="M56 82 V346" stroke="var(--gray)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- Handy -->
  <rect x="36" y="18" width="40" height="64" rx="8" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="43" y="28" width="22" height="8" rx="4" fill="var(--accent-pale)"/>
  <path d="M49 74 H63" stroke="var(--hairline)" stroke-width="3" stroke-linecap="round"/>
  <text class="lbl" x="114" y="50" data-t="reach.phone" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>

  <!-- Telegram (Internet) -->
  <path d="M47 170 a17 17 0 0 1 2 -34 a24 24 0 0 1 44 -8 a20 20 0 0 1 16 42 Z" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" transform="translate(-22 0)"/>
  <text class="lbl" x="114" y="152" data-t="reach.telegram" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>

  <!-- Weg: Tunnel durch den unveränderten Router -->
  <g data-variant="tunnel">
    <rect x="12" y="232" width="88" height="78" rx="10" fill="var(--bg)" stroke="var(--gray)" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="44" y="222" width="24" height="98" rx="12" fill="var(--accent-pale)" stroke="var(--accent)" stroke-width="2.5"/>
    <text class="lbl" x="114" y="271" data-t="reach.tunnel.label" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>
  </g>
  <!-- Weg: Freigabe in der FritzBox, eine offene Tür nur für diesen Weg -->
  <g data-variant="fritzbox">
    <path d="M34 240 V226 M78 240 V226" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="14" y="240" width="84" height="62" rx="10" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
    <rect x="44" y="252" width="24" height="50" rx="3" fill="var(--accent-pale)" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="26" cy="290" r="4" fill="var(--gray)"/>
    <text class="lbl" x="114" y="271" data-t="reach.fritzbox.label" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>
  </g>
  <!-- Weg: eigener Proxy (vorhandener Webserver) -->
  <g data-variant="proxy">
    <rect x="22" y="228" width="68" height="88" rx="8" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
    <path d="M32 250 H66 M32 272 H66 M32 294 H66" stroke="var(--gray)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="250" r="3.5" fill="var(--gray)"/>
    <circle cx="78" cy="272" r="3.5" fill="var(--gray)"/>
    <circle cx="78" cy="294" r="3.5" fill="var(--gray)"/>
    <text class="lbl" x="114" y="271" data-t="reach.proxy.label" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>
  </g>

  <!-- Dein Rechner zu Hause -->
  <path d="M12 384 L56 348 L100 384" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="20" y="380" width="72" height="58" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="36" y="390" width="40" height="28" rx="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
  <g data-mark="" transform="translate(46 394) scale(0.77)"/>
  <path d="M56 418 V426 M47 428 H65" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <text class="lbl" x="114" y="395" data-t="reach.home" data-wrap="15" data-lh="23" data-max="2" data-valign="middle"/>

  <circle class="dot" cx="56" cy="82" r="7" fill="var(--accent)"/>

  <!-- Hervorhebung der aktiven Station -->
  <rect class="ring on1" x="4" y="8" width="272" height="84" rx="14"/>
  <rect class="ring on2" x="4" y="112" width="272" height="80" rx="14"/>
  <rect class="ring on3" x="4" y="212" width="272" height="120" rx="14"/>
  <rect class="ring on4" x="4" y="340" width="272" height="104" rx="14"/>

  <!-- Bildunterschrift je Szene (bis vier Zeilen); der Wizard zeigt die schmale Fassung ohne sie -->
  <text data-full="" class="cap on1" x="140" y="506" data-t="reach.s1" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
  <text data-full="" class="cap on2" x="140" y="506" data-t="reach.s2" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
  <text data-full="" class="cap on3" x="140" y="506" data-variant="tunnel" data-t="reach.tunnel.s3" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
  <text data-full="" class="cap on3" x="140" y="506" data-variant="fritzbox" data-t="reach.fritzbox.s3" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
  <text data-full="" class="cap on3" x="140" y="506" data-variant="proxy" data-t="reach.proxy.s3" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
  <text data-full="" class="cap on4" x="140" y="506" data-t="reach.s4" data-wrap="29" data-lh="22" data-max="4" data-valign="middle"/>
</svg>
