<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" data-scenes="4" data-scene-s="2.5">
  <!-- Wege ins Internet: Quelle für die Wizard-Seite reach (Bild wechselt mit der Auswahl) und die Weg-Seiten der Anleitung.
       Varianten tunnel / fritzbox / proxy (data-variant), Generator scripts/build_ui_tokens.ps1, Format scripts/lib/ui_art.ps1.
       Szenen: 1 Handy, 2 Telegram, 3 der gewählte Weg, 4 dein Rechner. Kein Telegram- oder Hersteller-Logo: Internet = Wolke. -->
  <style>
    text { font-family: var(--font); fill: var(--ink); }
    .cap { font-size: 16px; text-anchor: middle; }
    .lbl { font-size: 14px; text-anchor: middle; }
    .sub { font-size: 11px; text-anchor: middle; fill: var(--gray); }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .dot { opacity: 0; }
    @keyframes dot {
      0% { opacity: 0; transform: translateX(0); }
      2% { opacity: 1; transform: translateX(0); }
      22%, 27% { opacity: 1; transform: translateX(121px); }
      47%, 52% { opacity: 1; transform: translateX(306px); }
      72%, 74% { opacity: 1; transform: translateX(496px); }
      76%, 100% { opacity: 0; transform: translateX(496px); }
    }
    @media (prefers-reduced-motion: no-preference) { .dot { animation: dot 10s linear infinite; } }
  </style>

  <path d="M94 100 H570" stroke="var(--gray)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- Handy -->
  <rect x="46" y="54" width="48" height="88" rx="9" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="54" y="68" width="26" height="10" rx="5" fill="var(--accent-pale)"/>
  <path d="M62 132 H78" stroke="var(--hairline)" stroke-width="3" stroke-linecap="round"/>
  <text class="lbl" x="70" y="180" data-t="reach.phone" data-wrap="18" data-lh="17" data-max="2"/>

  <!-- Telegram (Internet) -->
  <path d="M184 120 a17 17 0 0 1 2 -34 a24 24 0 0 1 44 -8 a20 20 0 0 1 16 42 Z" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
  <text class="lbl" x="215" y="180" data-t="reach.telegram" data-wrap="18" data-lh="17" data-max="2"/>

  <!-- Weg: Tunnel durch den unveränderten Router -->
  <g data-variant="tunnel">
    <rect x="350" y="66" width="100" height="68" rx="10" fill="var(--bg)" stroke="var(--gray)" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="318" y="88" width="164" height="24" rx="12" fill="var(--accent-pale)" stroke="var(--accent)" stroke-width="2.5"/>
    <text class="sub" x="400" y="129" data-t="reach.router" data-wrap="14"/>
    <text class="lbl" x="400" y="180" data-t="reach.tunnel.label" data-wrap="18" data-lh="17" data-max="2"/>
  </g>
  <!-- Weg: Freigabe in der FritzBox, eine offene Tür nur für diesen Weg -->
  <g data-variant="fritzbox">
    <path d="M370 66 V50 M430 66 V50" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="350" y="66" width="100" height="68" rx="10" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
    <rect x="386" y="84" width="28" height="50" rx="3" fill="var(--accent-pale)" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="364" cy="122" r="4" fill="var(--gray)"/>
    <text class="lbl" x="400" y="180" data-t="reach.fritzbox.label" data-wrap="18" data-lh="17" data-max="2"/>
  </g>
  <!-- Weg: eigener Proxy (vorhandener Webserver) -->
  <g data-variant="proxy">
    <rect x="362" y="54" width="76" height="92" rx="8" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
    <path d="M374 76 H414 M374 100 H414 M374 124 H414" stroke="var(--gray)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="424" cy="76" r="3.5" fill="var(--gray)"/>
    <circle cx="424" cy="100" r="3.5" fill="var(--gray)"/>
    <circle cx="424" cy="124" r="3.5" fill="var(--gray)"/>
    <text class="lbl" x="400" y="180" data-t="reach.proxy.label" data-wrap="18" data-lh="17" data-max="2"/>
  </g>

  <!-- Dein Rechner zu Hause -->
  <path d="M562 80 L610 40 L658 80" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="572" y="76" width="76" height="66" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="588" y="90" width="44" height="32" rx="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
  <g data-mark="" transform="translate(600 96) scale(0.77)"/>
  <path d="M610 122 V130 M600 132 H620" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <text class="lbl" x="610" y="180" data-t="reach.home" data-wrap="13" data-lh="17" data-max="2"/>

  <circle class="dot" cx="94" cy="100" r="7" fill="var(--accent)"/>

  <!-- Hervorhebung der aktiven Station -->
  <rect class="ring on1" x="36" y="44" width="68" height="108" rx="14"/>
  <rect class="ring on2" x="166" y="58" width="98" height="78" rx="16"/>
  <rect class="ring on3" x="308" y="40" width="184" height="116" rx="16"/>
  <rect class="ring on4" x="550" y="28" width="120" height="126" rx="16"/>

  <!-- Bildunterschrift je Szene -->
  <text class="cap on1" x="360" y="248" data-t="reach.s1" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
  <text class="cap on2" x="360" y="248" data-t="reach.s2" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
  <text class="cap on3" x="360" y="248" data-variant="tunnel" data-t="reach.tunnel.s3" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
  <text class="cap on3" x="360" y="248" data-variant="fritzbox" data-t="reach.fritzbox.s3" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
  <text class="cap on3" x="360" y="248" data-variant="proxy" data-t="reach.proxy.s3" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
  <text class="cap on4" x="360" y="248" data-t="reach.s4" data-wrap="70" data-lh="21" data-max="2" data-valign="middle"/>
</svg>
