<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Übersicht-Animation rendern</title>
<!-- Nur fuer scripts/dev/render_app_intro.ps1 (Headless-Chrome, -dump-dom): zeichnet die kurze Erklaer-Animation fuer die
     Ankuendigung der Uebersicht auf ein Canvas (doppelte Pixeldichte) und kodiert sie mit WebCodecs als H.264-MP4
     (Telegram sendAnimation). Eingabe im URL-Fragment: {scheme, sink, texts: {<sprache>: {btn, title}}}. Nur Knopf und Titel
     sind Text, der Rest Platzhalter-Balken ohne Betraege. Kein ffmpeg auf dem Entwicklerrechner: den MP4-Container schreibt
     der kleine Muxer hier. Farben aus config/ui.tokens.json. Kein Netz. -->
</head>
<body>
<pre id="out">pending</pre>
<script>
(function () {
  var W = 360, H = 560, SCALE = 2, PW = W * SCALE, PH = H * SCALE, FPS = 25, BITRATE = 1800000, T = 5.2;
  var SCHEMES = {
    dunkel: { chat: '#0E1317', bubble: '#1B2329', bar: '#1B2329', page: '#1B2329', card: '#12181D', sk: '#3A4650', skSoft: '#2A343C', accent: '#5DB7DD', line: '#2A343C', finger: '#EEF3F6', ring: '#12181D' }
  };
  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function span(t, a, b) { return ease((t - a) / (b - a)); }
  function rr(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }

  // Knopf unten links im Chat: Saeulen statt Text, damit keine Sprache im Bild steht.
  var FONT = '"Segoe UI","Malgun Gothic",sans-serif';
  var BTN = { x: 16, y: H - 54, w: 56, h: 38 };
  var TELEGRAM_BLUE = '#2AABEE', TEXT = { btn: '', title: '' };
  function fitButton(c) { c.font = '600 15px ' + FONT; BTN.w = Math.ceil(c.measureText(TEXT.btn).width) + 24; }
  // Reihen des Bildschirms „Vermoegen“: Zeile 1 klappt auf.
  var ROW_H = 58, ROW_GAP = 8, ROW_TOP = 168, EXPAND = 74, TAP_ROW = 1;

  function drawChat(c, s) {
    rr(c, 0, 0, W, H, 0, s.chat);
    rr(c, 16, H - 250, 210, 58, 14, s.bubble); rr(c, 30, H - 234, 150, 10, 5, s.sk); rr(c, 30, H - 214, 100, 10, 5, s.skSoft);
    rr(c, 16, H - 180, 250, 76, 14, s.bubble); rr(c, 30, H - 164, 190, 10, 5, s.sk); rr(c, 30, H - 144, 210, 10, 5, s.skSoft); rr(c, 30, H - 124, 120, 10, 5, s.skSoft);
    rr(c, 8, H - 62, W - 16, 54, 16, s.bar);
    rr(c, BTN.x, BTN.y, BTN.w, BTN.h, 10, TELEGRAM_BLUE);
    c.font = '600 15px ' + FONT; c.textBaseline = 'middle'; c.fillStyle = '#FFFFFF';
    c.fillText(TEXT.btn, BTN.x + 12, BTN.y + BTN.h / 2 + 1);
    var inputX = BTN.x + BTN.w + 12;
    rr(c, inputX, H - 42, Math.max(40, W - inputX - 28), 12, 6, s.skSoft);
  }
  function drawRow(c, s, y, h, open, labelW) {
    rr(c, 16, y, W - 32, h, 14, s.card);
    rr(c, 32, y + 16, labelW, 11, 5, s.sk);
    rr(c, 32, y + 34, labelW * 0.55, 8, 4, s.skSoft);
    rr(c, W - 110, y + 20, 60, 12, 6, s.sk);
    var cx = W - 38, cy = y + 26, d = open * Math.PI;
    c.save(); c.translate(cx, cy); c.rotate(d); c.strokeStyle = s.sk; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-5, -3); c.lineTo(0, 3); c.lineTo(5, -3); c.stroke(); c.restore();
    if (h > ROW_H + 4) {
      c.save(); c.beginPath(); c.rect(16, y + ROW_H - 4, W - 32, h - ROW_H + 4); c.clip();
      c.fillStyle = s.line; c.fillRect(32, y + ROW_H, W - 64, 1);
      [0, 1].forEach(function (i) {
        var ry = y + ROW_H + 13 + i * 26;
        rr(c, 40, ry, [120, 90][i], 9, 4, s.skSoft);
        rr(c, W - 100, ry, 50, 9, 4, s.skSoft);
      });
      c.restore();
    }
  }
  function drawApp(c, s, top, open) {
    c.save(); c.translate(0, top);
    rr(c, 0, 0, W, H + 30, [18, 18, 0, 0], s.page);
    rr(c, W / 2 - 18, 8, 36, 4, 2, s.sk);
    c.font = '700 21px ' + FONT; c.textBaseline = 'middle'; c.fillStyle = s.finger;
    c.fillText(TEXT.title, 20, 35);
    rr(c, 16, 56, W - 32, 96, 16, s.card);
    c.save(); c.beginPath(); c.roundRect(16, 56, W - 32, 96, 16); c.clip(); c.fillStyle = s.accent; c.fillRect(16, 56, W - 32, 4); c.restore();
    rr(c, 32, 76, 90, 9, 4, s.skSoft);
    rr(c, 32, 96, 190, 24, 10, s.sk);
    rr(c, 32, 130, 150, 8, 4, s.skSoft);
    var y = ROW_TOP, lab = [120, 150, 100, 130];
    for (var i = 0; i < 4; i++) {
      var h = ROW_H + (i === TAP_ROW ? open * EXPAND : 0);
      drawRow(c, s, y, h, i === TAP_ROW ? open : 0, lab[i]);
      y += h + ROW_GAP;
    }
    c.restore();
  }
  function drawFinger(c, s, x, y, press, alpha) {
    if (alpha <= 0) return;
    c.save(); c.globalAlpha = alpha;
    if (press > 0) { c.strokeStyle = s.accent; c.lineWidth = 4; c.beginPath(); c.arc(x, y, 18 + press * 26, 0, 7); c.stroke(); }
    c.fillStyle = s.ring; c.beginPath(); c.arc(x, y, 18 - press * 3, 0, 7); c.fill();
    c.fillStyle = s.finger; c.beginPath(); c.arc(x, y, 14 - press * 3, 0, 7); c.fill();
    c.restore();
  }
  function frame(c, s, t) {
    var up = span(t, 1.25, 1.7) - span(t, 4.65, 5.05);
    var open = span(t, 2.8, 3.2);
    drawChat(c, s);
    if (up > 0) drawApp(c, s, 30 + (1 - up) * (H - 30), open);
    var tapY = 30 + ROW_TOP + ROW_GAP + ROW_H + ROW_H / 2;
    var bx = BTN.x + BTN.w / 2, by = BTN.y + BTN.h / 2, mx = W * 0.72, my = H * 0.42;
    var x, y, press = 0, a = 1;
    if (t < 1.25) {
      var k = span(t, 0.15, 0.9); x = mx + (bx - mx) * k; y = my + (by - my) * k;
      press = t > 0.95 ? Math.sin(((t - 0.95) / 0.3) * Math.PI) : 0;
      a = span(t, 0, 0.2);
    } else if (t < 1.8) {
      x = bx; y = by; a = 1 - span(t, 1.3, 1.65);
    } else if (t < 2.8) {
      var q = span(t, 1.9, 2.5); x = W * 0.6; y = H - 60 + (tapY - (H - 60)) * q;
      press = t > 2.5 ? Math.sin(((t - 2.5) / 0.3) * Math.PI) : 0;
      a = span(t, 1.8, 2.05);
    } else { x = W * 0.6; y = tapY; a = 1 - span(t, 2.85, 3.2); }
    drawFinger(c, s, x, y, press, a);
  }

  // MP4-Container von Hand: ftyp + moov + mdat, ein Video-Track (avc1, ohne Ton, ohne B-Frames). sendAnimation nimmt H.264 ohne Ton an.
  function cat(parts) {
    var n = 0; parts.forEach(function (p) { n += p.length; });
    var o = new Uint8Array(n), k = 0; parts.forEach(function (p) { o.set(p, k); k += p.length; }); return o;
  }
  function u32(v) { return new Uint8Array([(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255]); }
  function u16(v) { return new Uint8Array([(v >> 8) & 255, v & 255]); }
  function tag(s) { return new Uint8Array([s.charCodeAt(0), s.charCodeAt(1), s.charCodeAt(2), s.charCodeAt(3)]); }
  function box(type) {
    var body = cat([].slice.call(arguments, 1));
    return cat([u32(body.length + 8), tag(type), body]);
  }
  function zeros(n) { return new Uint8Array(n); }
  function fullbox(type, flags) { return box.apply(null, [type, u32(flags)].concat([].slice.call(arguments, 2))); }
  function mp4(samples, avcC) {
    var TS = 1000 * FPS, DUR = 1000;
    var total = samples.length * DUR;
    var matrix = cat([u32(0x10000), zeros(12), u32(0x10000), zeros(12), u32(0x40000000)]);
    var ftyp = box('ftyp', tag('isom'), u32(512), tag('isom'), tag('iso2'), tag('avc1'), tag('mp41'));
    var mvhd = fullbox('mvhd', 0, u32(0), u32(0), u32(TS), u32(total), u32(0x10000), u16(0x100), zeros(10), matrix, zeros(24), u32(2));
    var tkhd = fullbox('tkhd', 3, u32(0), u32(0), u32(1), u32(0), u32(total), zeros(8), u16(0), u16(0), u16(0), u16(0), matrix, u32(PW * 65536), u32(PH * 65536));
    var mdhd = fullbox('mdhd', 0, u32(0), u32(0), u32(TS), u32(total), u16(0x55C4), u16(0));
    var hdlr = fullbox('hdlr', 0, u32(0), tag('vide'), zeros(12), new Uint8Array([86, 105, 100, 101, 111, 0]));
    var vmhd = fullbox('vmhd', 1, zeros(8));
    var dinf = box('dinf', fullbox('dref', 0, u32(1), fullbox('url ', 1)));
    var avc1 = box('avc1', zeros(6), u16(1), zeros(16), u16(PW), u16(PH), u32(0x480000), u32(0x480000), u32(0), u16(1), zeros(32), u16(0x18), u16(0xFFFF), box('avcC', avcC));
    var stsd = fullbox('stsd', 0, u32(1), avc1);
    var stts = fullbox('stts', 0, u32(1), u32(samples.length), u32(DUR));
    var keys = []; samples.forEach(function (s, i) { if (s.key) keys.push(i + 1); });
    var stss = fullbox('stss', 0, u32(keys.length), cat(keys.map(u32)));
    var stsc = fullbox('stsc', 0, u32(1), u32(1), u32(samples.length), u32(1));
    var stsz = fullbox('stsz', 0, u32(0), u32(samples.length), cat(samples.map(function (s) { return u32(s.data.length); })));
    var mdatBody = cat(samples.map(function (s) { return s.data; }));
    var offset = ftyp.length + 0; // stco braucht die Position von mdat: ftyp + moov + 8; moov-Laenge haengt nicht vom Wert ab.
    function moovWith(off) {
      var stco = fullbox('stco', 0, u32(1), u32(off));
      var stbl = box('stbl', stsd, stts, stss, stsc, stsz, stco);
      return box('moov', mvhd, box('trak', tkhd, box('mdia', mdhd, hdlr, box('minf', vmhd, dinf, stbl))));
    }
    var moovLen = moovWith(0).length;
    return cat([ftyp, moovWith(ftyp.length + moovLen + 8), box('mdat', mdatBody)]);
  }
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i += 8190) s += btoa(String.fromCharCode.apply(null, u.subarray(i, i + 8190))); return s; }

  // Ein Video je Sprache. Aufloesung PW x PH (Faktor SCALE ueber der Zeichen-Flaeche), Kodierung ueber WebCodecs (H.264 High).
  async function video(cv, c) {
    var samples = [], avcC = null, err = null;
    var enc = new VideoEncoder({
      output: function (chunk, meta) {
        if (meta && meta.decoderConfig && meta.decoderConfig.description) avcC = new Uint8Array(meta.decoderConfig.description);
        var d = new Uint8Array(chunk.byteLength); chunk.copyTo(d); samples.push({ data: d, key: chunk.type === 'key' });
      },
      error: function (e) { err = e; }
    });
    enc.configure({ codec: 'avc1.640028', width: PW, height: PH, bitrate: BITRATE, framerate: FPS, avc: { format: 'avc' }, latencyMode: 'quality' });
    var n = Math.round(T * FPS);
    for (var i = 0; i < n; i++) {
      c.clearRect(0, 0, W, H); frame(c, SCHEMES[SCHEME], i / FPS);
      var vf = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS) });
      enc.encode(vf, { keyFrame: i % 25 === 0 }); vf.close();
      if (enc.encodeQueueSize > 8) await new Promise(function (r) { setTimeout(r, 0); });
    }
    await enc.flush(); enc.close();
    if (err) throw err;
    if (!avcC) throw new Error('kein avcC vom Encoder');
    return mp4(samples, avcC);
  }

  // Die Kodierung laeuft in Echtzeit-Threads, --dump-dom wartet darauf nicht: Ergebnis per POST an den lokalen Empfaenger des Skripts.
  function send(sink, text) { return fetch(sink, { method: 'POST', mode: 'no-cors', body: text }); }
  var SCHEME = 'dunkel';
  (async function () {
    try {
      var res = {}, input = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      SCHEME = input.scheme;
      var langs = Object.keys(input.texts);
      for (var li = 0; li < langs.length; li++) {
        TEXT = input.texts[langs[li]];
        var cv = document.createElement('canvas'); cv.width = PW; cv.height = PH;
        var c = cv.getContext('2d');
        c.scale(SCALE, SCALE);
        fitButton(c);
        res[langs[li]] = 'data:video/mp4;base64,' + b64(await video(cv, c));
      }
      await send(input.sink, JSON.stringify(res));
    } catch (e) { try { await send(input.sink, 'ERROR ' + e.message); } catch (e2) { document.getElementById('out').textContent = 'ERROR ' + e.message; } }
  })();
})();
</script>
</body>
</html>
