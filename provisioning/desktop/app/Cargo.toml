[package]
name = "lifeagents-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Start-App: prueft den Rechner, holt oder nutzt Docker und zeigt den Fragebogen"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lifeagents-desktop-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
