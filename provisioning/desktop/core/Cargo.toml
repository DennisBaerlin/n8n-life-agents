[package]
name = "lifeagents-desktop-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Pruef- und Aenderungs-Logik der Start-App, ohne Tauri, gegen eine Befehls-Attrappe testbar"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
trash = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.16"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
