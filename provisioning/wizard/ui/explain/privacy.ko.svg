<!-- Erzeugt von scripts/build_ui_tokens.ps1 aus config/ui.art.privacy.svg, nicht von Hand ändern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" lang="ko">
  <style>
:root { --ink: #17212B; --gray: #55636E; --hairline: #E2E7EC; --accent: #12638A; --accent-hover: #0D4D6C; --accent-mid: #A8D3E6; --accent-pale: #DCF0F8; --accent-wash: #F1F8FB; --code-wash: #F1F8FB; --ok: #1E9E6A; --warn: #CC8600; --warn-wash: #FDF3D8; --alert: #D23F44; --alert-wash: #FDE8E8; --bg: #FFFFFF; --bg-soft: #F1F8FB; --font: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ink: #EEF3F6; --gray: #A2B1BC; --hairline: #2A343C; --accent: #5DB7DD; --accent-hover: #A8D3E6; --accent-mid: #2A5A70; --accent-pale: #183A4A; --accent-wash: #1B2329; --code-wash: #2A343C; --ok: #3CC08C; --warn: #E0A030; --warn-wash: #3A2E10; --alert: #E5605F; --alert-wash: #3D1F20; --bg: #12181D; --bg-soft: #1B2329; } }
@keyframes in1 { 0% { opacity: 0 } 1.67%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on1 { 0% { opacity: 0 } 1.67%, 23.33% { opacity: 1 } 25%, 100% { opacity: 0 } }
.on1 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in1 { animation: in1 24s linear infinite } .on1 { animation: on1 24s linear infinite } }
@keyframes in2 { 0%, 25% { opacity: 0 } 26.67%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on2 { 0%, 25% { opacity: 0 } 26.67%, 48.33% { opacity: 1 } 50%, 100% { opacity: 0 } }
.on2 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in2 { animation: in2 24s linear infinite } .on2 { animation: on2 24s linear infinite } }
@keyframes in3 { 0%, 50% { opacity: 0 } 51.67%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on3 { 0%, 50% { opacity: 0 } 51.67%, 73.33% { opacity: 1 } 75%, 100% { opacity: 0 } }
.on3 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in3 { animation: in3 24s linear infinite } .on3 { animation: on3 24s linear infinite } }
@keyframes in4 { 0%, 75% { opacity: 0 } 76.67%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on4 { 0%, 75% { opacity: 0 } 76.67%, 97% { opacity: 1 } 100% { opacity: 0 } }
.on4 { opacity: 1 }
@media (prefers-reduced-motion: no-preference) { .in4 { animation: in4 24s linear infinite } .on4 { animation: on4 24s linear infinite } }
text { font-family: var(--font); fill: var(--ink); }
    .cap { font-size: 22px; text-anchor: middle; }
    .nar { display: none; font-size: 32px; text-anchor: middle; }
    .label { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .name { font-size: 26px; font-weight: 600; text-anchor: middle; }
    .chip { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .card { font-size: 14px; text-anchor: middle; }
    /* Schmal angezeigt: Beschriftungen vergrößert, sonst wären sie unter 12 px; Text auf Karten und Marken entfällt, der Erklärtext sagt dasselbe. */
    @media (max-width: 520px) { .wide { display: none; } .nar { display: inline; } .label { font-size: 32px; } .name { font-size: 36px; } .chips, .card { display: none; } }
    .row { fill: var(--bg-soft); stroke: var(--hairline); stroke-width: 1.5; }
    .pale { fill: var(--accent-pale); }
    .box { fill: var(--bg); stroke: var(--ink); stroke-width: 3; }
    @keyframes fly { 0%, 28% { transform: translateX(0); } 44%, 100% { transform: translateX(120px); } }
    @keyframes back { 0%, 53% { transform: translateX(0); } 69%, 100% { transform: translateX(-135px); } }
    @media (prefers-reduced-motion: no-preference) { .fly { animation: fly 24s ease-in-out infinite; } .back { animation: back 24s ease-in-out infinite; } }
</style>
  <path class="box" d="M60 82 L170 18 L280 82 Z" />
  <rect class="box" x="74" y="82" width="192" height="128" />
  <rect class="row" x="96" y="96" width="148" height="18" rx="4" />
  <rect class="row" x="96" y="122" width="148" height="18" rx="4" />
  <rect class="row" x="96" y="148" width="148" height="18" rx="4" />
  <rect class="row" x="96" y="174" width="148" height="18" rx="4" />
  <rect class="pale on2" x="96" y="122" width="148" height="18" rx="4" />
  <text class="label" x="170" y="238">우리 집</text>
  <path d="M266 150 H470" stroke="var(--hairline)" stroke-width="2" stroke-dasharray="6 6" />
  <rect class="box" x="470" y="30" width="190" height="180" rx="18" />
  <text class="name" x="565" y="74">Claude</text>
  <g class="in3 chips">
    <rect class="pale" x="484" y="94" width="162" height="42" rx="21" />
    <text class="chip" x="565" y="121">학습 안 함</text>
  </g>
  <g class="in4 chips">
    <rect class="pale" x="484" y="148" width="162" height="42" rx="21" />
    <text class="chip" x="565" y="175">최대 30일</text>
  </g>
  <g class="on2"><g class="fly">
    <rect class="row pale" x="181" y="132" width="170" height="36" rx="10" />
    <text class="card" x="266" y="155">꼭 필요한 것만</text>
  </g></g>
  <g class="on3"><g class="back">
    <rect class="row" x="372" y="132" width="96" height="36" rx="10" />
    <text class="card" x="420" y="155">답변</text>
  </g></g>
  <text class="cap wide on1" x="360" y="306">데이터는 집에 있는 내 데이터베이스에 보관돼요.</text>
  <text class="cap wide on2" x="360" y="306">질문마다 꼭 필요한 내용만 Claude로 보내요.</text>
  <text class="cap wide on3" x="360" y="306">Claude가 답해요. 계약상 학습에는 쓸 수 없어요.</text>
  <text class="cap wide on4" x="360" y="306">Anthropic에 따르면 보통 최대 30일 안에 삭제돼요.</text>
  <text class="cap nar on1" x="360" y="306"><tspan x="360" dy="-20">데이터는 집에 있는 내 데이터베이스에</tspan><tspan x="360" dy="40">보관돼요.</tspan></text>
  <text class="cap nar on2" x="360" y="306"><tspan x="360" dy="-20">질문마다 꼭 필요한 내용만 Claude로</tspan><tspan x="360" dy="40">보내요.</tspan></text>
  <text class="cap nar on3" x="360" y="306"><tspan x="360" dy="-20">Claude가 답해요. 계약상 학습에는 쓸 수</tspan><tspan x="360" dy="40">없어요.</tspan></text>
  <text class="cap nar on4" x="360" y="306"><tspan x="360" dy="-20">Anthropic에 따르면 보통 최대 30일 안에</tspan><tspan x="360" dy="40">삭제돼요.</tspan></text>
</svg>
