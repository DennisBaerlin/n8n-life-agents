<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 452" width="280" height="452" role="img" lang="de">
  <style>
:root { --ink: #17212B; --gray: #55636E; --hairline: #E2E7EC; --accent: #12638A; --accent-hover: #0D4D6C; --accent-mid: #A8D3E6; --accent-pale: #DCF0F8; --accent-wash: #F1F8FB; --code-wash: #F1F8FB; --ok: #1E9E6A; --warn: #CC8600; --warn-wash: #FDF3D8; --alert: #D23F44; --alert-wash: #FDE8E8; --kid: #7A5AF8; --bg: #FFFFFF; --bg-soft: #F1F8FB; --font: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ink: #EEF3F6; --gray: #A2B1BC; --hairline: #2A343C; --accent: #5DB7DD; --accent-hover: #A8D3E6; --accent-mid: #2A5A70; --accent-pale: #183A4A; --accent-wash: #1B2329; --code-wash: #2A343C; --ok: #3CC08C; --warn: #E0A030; --warn-wash: #3A2E10; --alert: #E5605F; --alert-wash: #3D1F20; --kid: #A48AFB; --bg: #12181D; --bg-soft: #1B2329; } }
@keyframes in1 { 0% { opacity: 0 } 2.86%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on1 { 0% { opacity: 0 } 2.86%, 22.14% { opacity: 1 } 25%, 100% { opacity: 0 } }
.on1 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in1 { animation: in1 14s linear infinite } .on1 { animation: on1 14s linear infinite } }
@keyframes in2 { 0%, 25% { opacity: 0 } 27.86%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on2 { 0%, 25% { opacity: 0 } 27.86%, 47.14% { opacity: 1 } 50%, 100% { opacity: 0 } }
.on2 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in2 { animation: in2 14s linear infinite } .on2 { animation: on2 14s linear infinite } }
@keyframes in3 { 0%, 50% { opacity: 0 } 52.86%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on3 { 0%, 50% { opacity: 0 } 52.86%, 72.14% { opacity: 1 } 75%, 100% { opacity: 0 } }
.on3 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in3 { animation: in3 14s linear infinite } .on3 { animation: on3 14s linear infinite } }
@keyframes in4 { 0%, 75% { opacity: 0 } 77.86%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on4 { 0%, 75% { opacity: 0 } 77.86%, 97% { opacity: 1 } 100% { opacity: 0 } }
.on4 { opacity: 1 }
@media (prefers-reduced-motion: no-preference) { .in4 { animation: in4 14s linear infinite } .on4 { animation: on4 14s linear infinite } }
text { font-family: var(--font); fill: var(--ink); }
    .cap { font-size: 17px; text-anchor: middle; }
    .lbl { font-size: 19px; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .dot { opacity: 0; }
    @keyframes dot {
      0% { opacity: 0; transform: translateY(0); }
      2% { opacity: 1; transform: translateY(0); }
      22%, 27% { opacity: 1; transform: translateY(68px); }
      47%, 52% { opacity: 1; transform: translateY(188px); }
      72%, 74% { opacity: 1; transform: translateY(294px); }
      76%, 100% { opacity: 0; transform: translateY(294px); }
    }
    @media (prefers-reduced-motion: no-preference) { .dot { animation: dot 14s linear infinite; } }
</style>
