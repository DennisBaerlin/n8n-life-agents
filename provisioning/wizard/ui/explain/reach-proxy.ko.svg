<!-- Erzeugt von scripts/build_ui_tokens.ps1 aus config/ui.art.reach.svg, nicht von Hand ändern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" lang="ko">
  <style>
:root { --ink: #17212B; --gray: #55636E; --hairline: #E2E7EC; --accent: #12638A; --accent-hover: #0D4D6C; --accent-mid: #A8D3E6; --accent-pale: #DCF0F8; --accent-wash: #F1F8FB; --code-wash: #F1F8FB; --ok: #1E9E6A; --warn: #CC8600; --warn-wash: #FDF3D8; --alert: #D23F44; --alert-wash: #FDE8E8; --bg: #FFFFFF; --bg-soft: #F1F8FB; --font: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ink: #EEF3F6; --gray: #A2B1BC; --hairline: #2A343C; --accent: #5DB7DD; --accent-hover: #A8D3E6; --accent-mid: #2A5A70; --accent-pale: #183A4A; --accent-wash: #1B2329; --code-wash: #2A343C; --ok: #3CC08C; --warn: #E0A030; --warn-wash: #3A2E10; --alert: #E5605F; --alert-wash: #3D1F20; --bg: #12181D; --bg-soft: #1B2329; } }
@keyframes in1 { 0% { opacity: 0 } 4%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on1 { 0% { opacity: 0 } 4%, 21% { opacity: 1 } 25%, 100% { opacity: 0 } }
.on1 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in1 { animation: in1 10s linear infinite } .on1 { animation: on1 10s linear infinite } }
@keyframes in2 { 0%, 25% { opacity: 0 } 29%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on2 { 0%, 25% { opacity: 0 } 29%, 46% { opacity: 1 } 50%, 100% { opacity: 0 } }
.on2 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in2 { animation: in2 10s linear infinite } .on2 { animation: on2 10s linear infinite } }
@keyframes in3 { 0%, 50% { opacity: 0 } 54%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on3 { 0%, 50% { opacity: 0 } 54%, 71% { opacity: 1 } 75%, 100% { opacity: 0 } }
.on3 { opacity: 0 }
@media (prefers-reduced-motion: no-preference) { .in3 { animation: in3 10s linear infinite } .on3 { animation: on3 10s linear infinite } }
@keyframes in4 { 0%, 75% { opacity: 0 } 79%, 97% { opacity: 1 } 100% { opacity: 0 } }
@keyframes on4 { 0%, 75% { opacity: 0 } 79%, 97% { opacity: 1 } 100% { opacity: 0 } }
.on4 { opacity: 1 }
@media (prefers-reduced-motion: no-preference) { .in4 { animation: in4 10s linear infinite } .on4 { animation: on4 10s linear infinite } }
text { font-family: var(--font); fill: var(--ink); }
    .cap { font-size: 16px; text-anchor: middle; }
    .lbl { font-size: 14px; text-anchor: middle; }
    .sub { font-size: 13px; text-anchor: middle; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .dot { opacity: 0; }
    @keyframes dot {
      0% { opacity: 0; transform: translateX(0); }
      2% { opacity: 1; transform: translateX(0); }
      22%, 27% { opacity: 1; transform: translateX(121px); }
      47%, 52% { opacity: 1; transform: translateX(306px); }
      72%, 74% { opacity: 1; transform: translateX(496px); }
      76%, 100% { opacity: 0; transform: translateX(496px); }
    }
    @media (prefers-reduced-motion: no-preference) { .dot { animation: dot 10s linear infinite; } }
</style>
  <path d="M94 100 H570" stroke="var(--gray)" stroke-width="2" stroke-dasharray="6 6" fill="none" />
  <rect x="46" y="54" width="48" height="88" rx="9" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.5" />
  <rect x="54" y="68" width="26" height="10" rx="5" fill="var(--accent-pale)" />
  <path d="M62 132 H78" stroke="var(--hairline)" stroke-width="3" stroke-linecap="round" />
  <text class="lbl" x="70" y="180">내 휴대폰</text>
  <path d="M184 120 a17 17 0 0 1 2 -34 a24 24 0 0 1 44 -8 a20 20 0 0 1 16 42 Z" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" />
  <text class="lbl" x="215" y="180">인터넷 속 Telegram</text>
  <g>
    <rect x="362" y="54" width="76" height="92" rx="8" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5" />
    <path d="M374 76 H414 M374 100 H414 M374 124 H414" stroke="var(--gray)" stroke-width="3" stroke-linecap="round" />
    <circle cx="424" cy="76" r="3.5" fill="var(--gray)" />
    <circle cx="424" cy="100" r="3.5" fill="var(--gray)" />
    <circle cx="424" cy="124" r="3.5" fill="var(--gray)" />
    <text class="lbl" x="400" y="180">내 프록시</text>
  </g>
  <path d="M562 80 L610 40 L658 80" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="572" y="76" width="76" height="66" fill="var(--bg-soft)" stroke="var(--ink)" stroke-width="2.5" />
  <rect x="588" y="90" width="44" height="32" rx="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2" />
  <g transform="translate(600 96) scale(0.77)"><path xmlns="http://www.w3.org/2000/svg" d="M13 2.5 L22 10 V19.5 H11.5 L7 23.5 V19.5 H4 V10 Z" fill="var(--mark, var(--accent))" stroke="var(--mark, var(--accent))" stroke-width="2" stroke-linejoin="round" /><path xmlns="http://www.w3.org/2000/svg" d="M8.6 12.8 L11.7 15.8 L17.4 10" fill="none" stroke="var(--mark-check, var(--bg))" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g>
  <path d="M610 122 V130 M600 132 H620" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" />
  <text class="lbl" x="610" y="180"><tspan x="610" dy="0">집에 있는 내</tspan><tspan x="610" dy="17">컴퓨터</tspan></text>
  <circle class="dot" cx="94" cy="100" r="7" fill="var(--accent)" />
  <rect class="ring on1" x="36" y="44" width="68" height="108" rx="14" />
  <rect class="ring on2" x="166" y="58" width="98" height="78" rx="16" />
  <rect class="ring on3" x="308" y="40" width="184" height="116" rx="16" />
  <rect class="ring on4" x="550" y="28" width="120" height="126" rx="16" />
  <text class="cap on1" x="360" y="248">휴대폰으로 어시스턴트에게 메시지를 보내요.</text>
  <text class="cap on2" x="360" y="248">Telegram이 인터넷으로 메시지를 보내요.</text>
  <text class="cap on3" x="360" y="248">프록시는 인터넷의 중간 컴퓨터예요. 메시지를 받아 집으로 전달해요.</text>
  <text class="cap on4" x="360" y="248">컴퓨터가 답하고, 데이터는 집에 남아요.</text>
</svg>
